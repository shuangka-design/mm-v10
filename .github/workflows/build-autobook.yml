name: Build AutoBook APK (v1 auto expense book)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Generate project
        run: |
          set -e
          P=/tmp/ab
          J=$P/app/src/main/java/com/example/autobook
          mkdir -p $J
          cd $P

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AutoBook"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.10.1" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.example.autobook"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.example.autobook"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation("com.google.mlkit:genai-prompt:1.0.0-beta5")
              implementation("com.google.guava:guava:33.3.1-android")
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.android.gms:play-services-tasks:18.2.0")
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.1.0"))
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <application
                  android:icon="@android:drawable/ic_menu_agenda"
                  android:label="AutoBook"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".EditActivity" android:exported="false"
                      android:windowSoftInputMode="adjustResize" />
                  <service
                      android:name=".BankNotificationService"
                      android:label="AutoBook"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > $J/Db.java << 'EOF'
          package com.example.autobook;

          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.database.DatabaseUtils;
          import android.database.sqlite.SQLiteDatabase;
          import android.database.sqlite.SQLiteOpenHelper;
          import java.util.ArrayList;
          import java.util.List;

          /** All data lives in one SQLite file: book.db */
          public class Db extends SQLiteOpenHelper {
              public static class Tx {
                  public long id = 0, ts = 0;
                  public int type = 0;            // 0 = expense, 1 = income
                  public double amount = 0;
                  public String account = "", category = "", note = "", photo = "", source = "manual", bank = "";
                  public boolean needAi = false, needCat = false;
              }

              private static Db inst;

              public static synchronized Db get(Context c) {
                  if (inst == null) inst = new Db(c.getApplicationContext());
                  return inst;
              }

              public static synchronized void reset() {
                  if (inst != null) { inst.close(); inst = null; }
              }

              private Db(Context c) {
                  super(c, "book.db", null, 1);
                  setWriteAheadLoggingEnabled(false); // single file -> easy backup
              }

              @Override
              public void onCreate(SQLiteDatabase d) {
                  d.execSQL("CREATE TABLE tx (id INTEGER PRIMARY KEY AUTOINCREMENT, ts INTEGER, type INTEGER, amount REAL, "
                      + "account TEXT, category TEXT, note TEXT, photo TEXT, source TEXT, bank TEXT, "
                      + "need_ai INTEGER DEFAULT 0, need_cat INTEGER DEFAULT 0)");
                  d.execSQL("CREATE INDEX tx_ts ON tx(ts)");
                  d.execSQL("CREATE TABLE cat (name TEXT, type INTEGER, ord INTEGER, PRIMARY KEY(name, type))");
                  d.execSQL("CREATE TABLE acc (name TEXT PRIMARY KEY, ord INTEGER)");
                  d.execSQL("CREATE TABLE shopcat (shop TEXT PRIMARY KEY, category TEXT)");
                  String[] accs = { "กรุงไทย", "กรุงศรี", "ออมสิน", "TrueMoney", "AAT", "Cash", "Card" };
                  for (int i = 0; i < accs.length; i++) {
                      ContentValues v = new ContentValues();
                      v.put("name", accs[i]); v.put("ord", i);
                      d.insert("acc", null, v);
                  }
                  String[] ex = { "🍜 Food", "Lunch", "Dinner", "กาแฟ", "SHOPPEE", "TRUE MONEY", "น้ำมัน",
                      "ทำงาน", "🪑 Household", "Schooling", "Other" };
                  for (int i = 0; i < ex.length; i++) {
                      ContentValues v = new ContentValues();
                      v.put("name", ex[i]); v.put("type", 0); v.put("ord", i);
                      d.insert("cat", null, v);
                  }
                  String[] in = { "เงินเดือน", "Other" };
                  for (int i = 0; i < in.length; i++) {
                      ContentValues v = new ContentValues();
                      v.put("name", in[i]); v.put("type", 1); v.put("ord", i);
                      d.insert("cat", null, v);
                  }
              }

              @Override
              public void onUpgrade(SQLiteDatabase d, int o, int n) { }

              private static String s(String x) { return x == null ? "" : x; }

              private static ContentValues cv(Tx t) {
                  ContentValues v = new ContentValues();
                  v.put("ts", t.ts); v.put("type", t.type); v.put("amount", t.amount);
                  v.put("account", s(t.account)); v.put("category", s(t.category)); v.put("note", s(t.note));
                  v.put("photo", s(t.photo)); v.put("source", s(t.source)); v.put("bank", s(t.bank));
                  v.put("need_ai", t.needAi ? 1 : 0); v.put("need_cat", t.needCat ? 1 : 0);
                  return v;
              }

              private static Tx read(Cursor c) {
                  Tx t = new Tx();
                  t.id = c.getLong(c.getColumnIndexOrThrow("id"));
                  t.ts = c.getLong(c.getColumnIndexOrThrow("ts"));
                  t.type = c.getInt(c.getColumnIndexOrThrow("type"));
                  t.amount = c.getDouble(c.getColumnIndexOrThrow("amount"));
                  t.account = s(c.getString(c.getColumnIndexOrThrow("account")));
                  t.category = s(c.getString(c.getColumnIndexOrThrow("category")));
                  t.note = s(c.getString(c.getColumnIndexOrThrow("note")));
                  t.photo = s(c.getString(c.getColumnIndexOrThrow("photo")));
                  t.source = s(c.getString(c.getColumnIndexOrThrow("source")));
                  t.bank = s(c.getString(c.getColumnIndexOrThrow("bank")));
                  t.needAi = c.getInt(c.getColumnIndexOrThrow("need_ai")) == 1;
                  t.needCat = c.getInt(c.getColumnIndexOrThrow("need_cat")) == 1;
                  return t;
              }

              public synchronized long insert(Tx t) {
                  t.id = getWritableDatabase().insert("tx", null, cv(t));
                  return t.id;
              }

              public synchronized void update(Tx t) {
                  getWritableDatabase().update("tx", cv(t), "id=?", new String[] { String.valueOf(t.id) });
              }

              public synchronized void delete(long id) {
                  getWritableDatabase().delete("tx", "id=?", new String[] { String.valueOf(id) });
              }

              public synchronized void deleteSource(String src) {
                  getWritableDatabase().delete("tx", "source=?", new String[] { src });
              }

              public synchronized List<Tx> query(String where, String[] args, String order) {
                  List<Tx> out = new ArrayList<>();
                  try (Cursor c = getReadableDatabase().query("tx", null, where, args, null, null, order)) {
                      while (c.moveToNext()) out.add(read(c));
                  }
                  return out;
              }

              public Tx get(long id) {
                  List<Tx> l = query("id=?", new String[] { String.valueOf(id) }, null);
                  return l.isEmpty() ? null : l.get(0);
              }

              public List<Tx> range(long from, long to) {
                  return query("ts>=? AND ts<?", new String[] { String.valueOf(from), String.valueOf(to) }, "ts DESC, id DESC");
              }

              public List<Tx> pending() {
                  return query("need_ai=1 OR need_cat=1", null, "ts DESC");
              }

              /** same bank + same amount recently (bank apps often post the same notification twice) */
              public boolean duplicate(String bank, double amount, long since) {
                  return !query("bank=? AND ABS(amount-?)<0.005 AND ts>?",
                      new String[] { bank, String.valueOf(amount), String.valueOf(since) }, null).isEmpty();
              }

              /** latest tx from this bank (null = any bank) since time, optionally only without photo */
              public Tx recent(String bank, String source, long since, boolean noPhoto) {
                  List<String> a = new ArrayList<>();
                  StringBuilder w = new StringBuilder("ts>?");
                  a.add(String.valueOf(since));
                  if (bank != null) { w.append(" AND bank=?"); a.add(bank); }
                  else { w.append(" AND bank<>''"); }
                  if (source != null) { w.append(" AND source=?"); a.add(source); }
                  if (noPhoto) w.append(" AND (photo IS NULL OR photo='')");
                  List<Tx> l = query(w.toString(), a.toArray(new String[0]), "ts DESC");
                  return l.isEmpty() ? null : l.get(0);
              }

              private List<String> names(String sql, String[] args) {
                  List<String> out = new ArrayList<>();
                  try (Cursor c = getReadableDatabase().rawQuery(sql, args)) {
                      while (c.moveToNext()) out.add(c.getString(0));
                  }
                  return out;
              }

              public synchronized List<String> categories(int type) {
                  return names("SELECT name FROM cat WHERE type=? ORDER BY ord", new String[] { String.valueOf(type) });
              }

              public synchronized List<String> accounts() {
                  return names("SELECT name FROM acc ORDER BY ord", null);
              }

              public synchronized void addCategory(String name, int type) {
                  if (name == null || name.trim().isEmpty()) return;
                  SQLiteDatabase d = getWritableDatabase();
                  ContentValues v = new ContentValues();
                  v.put("name", name.trim()); v.put("type", type);
                  v.put("ord", DatabaseUtils.queryNumEntries(d, "cat"));
                  d.insertWithOnConflict("cat", null, v, SQLiteDatabase.CONFLICT_IGNORE);
              }

              public synchronized void addAccount(String name) {
                  if (name == null || name.trim().isEmpty()) return;
                  SQLiteDatabase d = getWritableDatabase();
                  ContentValues v = new ContentValues();
                  v.put("name", name.trim());
                  v.put("ord", DatabaseUtils.queryNumEntries(d, "acc"));
                  d.insertWithOnConflict("acc", null, v, SQLiteDatabase.CONFLICT_IGNORE);
              }

              public synchronized void rememberShop(String shop, String cat) {
                  if (shop == null || shop.isEmpty() || cat == null || cat.isEmpty()) return;
                  ContentValues v = new ContentValues();
                  v.put("shop", shop); v.put("category", cat);
                  getWritableDatabase().insertWithOnConflict("shopcat", null, v, SQLiteDatabase.CONFLICT_REPLACE);
              }

              public synchronized String shopCategory(String shop) {
                  if (shop == null || shop.isEmpty()) return null;
                  List<String> l = names("SELECT category FROM shopcat WHERE shop=?", new String[] { shop });
                  return l.isEmpty() ? null : l.get(0);
              }
          }
          EOF

          cat > $J/Util.java << 'EOF'
          package com.example.autobook;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class Util {
              public static String money(double v) { return String.format(Locale.US, "%,.2f", v); }

              public static String cut(String s, int n) {
                  if (s == null) return "";
                  return s.length() > n ? s.substring(0, n) + "…" : s;
              }

              /** shop key for remembering categories: drop numbers/dates/amounts */
              public static String key(String note) {
                  if (note == null) return "";
                  String k = note.replaceAll("[0-9.,:/\\-]+", " ").replaceAll("\\s+", " ").trim().toLowerCase(Locale.ROOT);
                  return k.length() > 40 ? k.substring(0, 40) : k;
              }

              /** bank label -> account name in this app */
              public static String account(String bank) {
                  if ("KTB".equals(bank)) return "กรุงไทย";
                  if ("KMA".equals(bank)) return "กรุงศรี";
                  if ("GSB".equals(bank)) return "ออมสิน";
                  if ("BBL".equals(bank)) return "กรุงเทพ";
                  if ("TrueMoney".equals(bank)) return "TrueMoney";
                  return "Cash";
              }

              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("autobook", Context.MODE_PRIVATE);
              }

              public static synchronized void debug(Context c, String line) {
                  String time = new SimpleDateFormat("dd/MM HH:mm:ss", Locale.US).format(new Date());
                  String entry = "[" + time + "] " + (line == null ? "" : line.replace("\n", " "));
                  String old = p(c).getString("debug", "");
                  String[] lines = (old.isEmpty() ? entry : entry + "\n" + old).split("\n");
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < lines.length && i < 25; i++) {
                      if (i > 0) sb.append("\n");
                      sb.append(lines[i]);
                  }
                  p(c).edit().putString("debug", sb.toString()).apply();
              }

              public static String debugLog(Context c) { return p(c).getString("debug", ""); }
          }
          EOF

          cat > $J/Photos.java << 'EOF'
          package com.example.autobook;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.net.Uri;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;

          /** Slip photos are copied into the app, so they stay even if deleted from the gallery. */
          public class Photos {
              public static File dir(Context c) {
                  File d = new File(c.getFilesDir(), "photos");
                  if (!d.exists()) d.mkdirs();
                  return d;
              }

              public static File file(Context c, String name) { return new File(dir(c), name); }

              public static void copy(InputStream in, OutputStream out) throws IOException {
                  byte[] b = new byte[16384];
                  int n;
                  while ((n = in.read(b)) > 0) out.write(b, 0, n);
              }

              public static String copy(Context c, Uri uri) throws IOException {
                  String name = "p" + System.currentTimeMillis() + ".jpg";
                  try (InputStream in = c.getContentResolver().openInputStream(uri);
                       OutputStream out = new FileOutputStream(file(c, name))) {
                      if (in == null) throw new IOException("เปิดรูปไม่ได้");
                      copy(in, out);
                  }
                  return name;
              }

              public static Bitmap load(File f, int max) {
                  if (f == null || !f.exists()) return null;
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(f.getPath(), o);
                  int s = 1;
                  while (Math.max(o.outWidth, o.outHeight) / s > max) s *= 2;
                  BitmapFactory.Options o2 = new BitmapFactory.Options();
                  o2.inSampleSize = s;
                  return BitmapFactory.decodeFile(f.getPath(), o2);
              }

              public static void delete(Context c, String name) {
                  if (name != null && !name.isEmpty()) file(c, name).delete();
              }
          }
          EOF

          cat > $J/BankParser.java << 'EOF'
          package com.example.autobook;

          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class BankParser {
              public static final Map<String, String> BANKS = new HashMap<>();
              static {
                  BANKS.put("ktbcs.netbank", "KTB");
                  BANKS.put("com.bbl.mobilebanking", "BBL");
                  BANKS.put("com.bangkokbank.mobilebanking", "BBL");
                  BANKS.put("com.krungsri.kma", "KMA");
                  BANKS.put("com.gsb.mymo", "GSB");
                  BANKS.put("th.co.truemoney.wallet", "TrueMoney");
              }

              private static final String[][] FOLDERS = {
                  { "krungthai", "KTB" }, { "ktb", "KTB" },
                  { "bualuang", "BBL" }, { "bangkok bank", "BBL" }, { "bbl", "BBL" },
                  { "krungsri", "KMA" }, { "kma", "KMA" },
                  { "mymo", "GSB" }, { "gsb", "GSB" },
                  { "truemoney", "TrueMoney" },
                  { "slip", "SLIP" }
              };

              private static final String[] IGNORE = { "OTP", "รหัสยืนยัน" };
              private static final String[] INCOME = { "เงินเข้า", "รับเงิน", "ได้รับเงิน", "รับโอน", "เติมเงินเข้า" };

              private static final String NUM = "([0-9][0-9,]*(?:\\.[0-9]{1,2})?)";
              private static final Pattern AFTER = Pattern.compile(
                  "-?" + NUM + "\\s*(?:บาท|บ\\.|THB|฿)", Pattern.CASE_INSENSITIVE);
              private static final Pattern BEFORE = Pattern.compile(
                  "(?:THB|฿|จำนวนเงิน|จำนวน|ยอดเงิน|ยอด)\\s*:?\\s*-?" + NUM, Pattern.CASE_INSENSITIVE);

              public static class Result {
                  public String bank, note;
                  public double amount;
                  public int type; // 0 expense, 1 income
              }

              public static boolean isBank(String pkg) { return BANKS.containsKey(pkg); }

              public static String bankFromPath(String path) {
                  String l = path.toLowerCase(Locale.ROOT);
                  for (String[] f : FOLDERS) if (l.contains(f[0])) return f[1];
                  return null;
              }

              public static Result parse(String pkg, String title, String text) {
                  String bank = BANKS.get(pkg);
                  if (bank == null) return null;
                  String msg = title + " " + text;
                  String up = msg.toUpperCase(Locale.ROOT);
                  for (String w : IGNORE) if (up.contains(w.toUpperCase(Locale.ROOT))) return null;
                  String a = find(AFTER, msg);
                  if (a == null) a = find(BEFORE, msg);
                  if (a == null) return null;
                  Result r = new Result();
                  r.bank = bank;
                  r.amount = Double.parseDouble(a);
                  r.type = 0;
                  for (String w : INCOME) if (msg.contains(w)) { r.type = 1; break; }
                  String note = text.isEmpty() ? title : text;
                  r.note = note.length() > 80 ? note.substring(0, 80) : note;
                  return r;
              }

              private static String find(Pattern p, String s) {
                  Matcher m = p.matcher(s);
                  while (m.find()) {
                      String a = m.group(1).replace(",", "");
                      try { if (Double.parseDouble(a) > 0) return a; } catch (NumberFormatException ignored) { }
                  }
                  return null;
              }
          }
          EOF

          cat > $J/Ai.java << 'EOF'
          package com.example.autobook;

          import android.graphics.Bitmap;
          import com.google.mlkit.genai.common.DownloadCallback;
          import com.google.mlkit.genai.common.FeatureStatus;
          import com.google.mlkit.genai.common.GenAiException;
          import com.google.mlkit.genai.prompt.Content;
          import com.google.mlkit.genai.prompt.GenerateContentRequest;
          import com.google.mlkit.genai.prompt.GenerateContentResponse;
          import com.google.mlkit.genai.prompt.Generation;
          import com.google.mlkit.genai.prompt.ImagePart;
          import com.google.mlkit.genai.prompt.TextPart;
          import com.google.mlkit.genai.prompt.java.GenerativeModelFutures;
          import java.io.File;
          import java.util.List;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** On-device Gemini Nano. Call from a background thread while the app is on screen. */
          public class Ai {
              private static final Pattern P_AMT = Pattern.compile("AMOUNT\\s*=\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)");
              private static final Pattern P_SHOP = Pattern.compile("SHOP\\s*=\\s*([^;\\n]*)");
              private static final Pattern P_CAT = Pattern.compile("CAT\\s*=\\s*([^;\\n]*)");

              private static GenerativeModelFutures model;

              private static synchronized GenerativeModelFutures m() {
                  if (model == null) model = GenerativeModelFutures.from(Generation.INSTANCE.getClient());
                  return model;
              }

              public static int status() {
                  try { return m().checkStatus().get(); } catch (Exception e) { return -1; }
              }

              public static boolean ready() { return status() == FeatureStatus.AVAILABLE; }

              public static boolean downloadable(int s) { return s == FeatureStatus.DOWNLOADABLE; }

              public static String statusText(int s) {
                  if (s == FeatureStatus.AVAILABLE) return "พร้อมใช้ ✅";
                  if (s == FeatureStatus.DOWNLOADABLE) return "ยังไม่ได้ดาวน์โหลด (กดปุ่ม 4)";
                  if (s == FeatureStatus.DOWNLOADING) return "กำลังดาวน์โหลด...";
                  if (s == FeatureStatus.UNAVAILABLE) return "เครื่องนี้ยังใช้ไม่ได้ ❌";
                  return "ตรวจสอบไม่ได้ ❌";
              }

              public interface Progress { void msg(String m); }

              public static void download(Progress cb) {
                  m().download(new DownloadCallback() {
                      @Override public void onDownloadStarted(long bytes) { cb.msg("เริ่มดาวน์โหลด AI..."); }
                      @Override public void onDownloadProgress(long done) { cb.msg("ดาวน์โหลดแล้ว " + (done / 1048576L) + " MB"); }
                      @Override public void onDownloadCompleted() { cb.msg("ดาวน์โหลด AI เสร็จแล้ว ✅"); }
                      @Override public void onDownloadFailed(GenAiException e) { cb.msg("ดาวน์โหลดไม่สำเร็จ: " + e.getMessage()); }
                  });
              }

              private static String ask(GenerateContentRequest.Builder b) throws Exception {
                  b.setTemperature(0f);
                  b.setTopK(1);
                  b.setMaxOutputTokens(120);
                  GenerateContentResponse r = m().generateContent(b.build()).get();
                  if (r.getCandidates().isEmpty()) return "";
                  String t = r.getCandidates().get(0).getText();
                  return t == null ? "" : t;
              }

              /** returns {amount, shop, category} or null */
              public static String[] readSlip(File f, List<String> cats) throws Exception {
                  Bitmap bmp = Photos.load(f, 1600);
                  if (bmp == null) return null;
                  String prompt = "This image is a Thai bank transfer or payment slip. "
                      + "Reply with exactly one line in this format and nothing else:\n"
                      + "AMOUNT=<amount>;SHOP=<receiver name>;CAT=<category>\n"
                      + "AMOUNT is the paid amount (จำนวนเงิน / จำนวน) as a number like 150.00. "
                      + "It is NOT the fee (ค่าธรรมเนียม) and NOT the balance (ยอดคงเหลือ). "
                      + "SHOP is the receiver (ไปยัง / ผู้รับ / ร้าน), keep Thai text as written. "
                      + "CAT must be exactly one of: " + String.join(", ", cats) + ". "
                      + "If this is not a payment slip, reply NONE.";
                  GenerateContentRequest.Builder b = new GenerateContentRequest.Builder(
                      new Content.Builder()
                          .addPart(new ImagePart(bmp))
                          .addPart(new TextPart(prompt))
                          .build());
                  String out = ask(b);
                  Matcher ma = P_AMT.matcher(out);
                  if (!ma.find()) return null;
                  Matcher ms = P_SHOP.matcher(out);
                  Matcher mc = P_CAT.matcher(out);
                  return new String[] {
                      ma.group(1).replace(",", ""),
                      ms.find() ? ms.group(1).trim() : "",
                      mc.find() ? fixCat(mc.group(1), cats) : ""
                  };
              }

              public static String categorize(String text, List<String> cats) throws Exception {
                  String prompt = "Classify this Thai payment into exactly one category from this list: "
                      + String.join(", ", cats) + ". Reply with the category only.\nPayment: " + text;
                  return fixCat(ask(new GenerateContentRequest.Builder(new TextPart(prompt))), cats);
              }

              private static String fixCat(String s, List<String> cats) {
                  if (s == null) return "";
                  String best = "";
                  for (String c : cats) if (s.contains(c) && c.length() > best.length()) best = c;
                  return best;
              }
          }
