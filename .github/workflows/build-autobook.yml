              private void renderAccounts() {
                  Db db = Db.get(this);
                  LinkedHashMap<String, Double> bal = new LinkedHashMap<>();
                  for (String a : db.accounts()) bal.put(a, 0.0);
                  for (Db.Tx t : db.query(null, null, null)) {
                      String a = t.account.isEmpty() ? "ไม่ระบุบัญชี" : t.account;
                      if (t.type == 2) {
                          bal.merge(a, -t.amount, Double::sum);
                          bal.merge(t.toAccount.isEmpty() ? "ไม่ระบุบัญชี" : t.toAccount, t.amount, Double::sum);
                      } else {
                          bal.merge(a, t.type == 1 || t.type == 3 ? t.amount : -t.amount, Double::sum);
                      }
                  }
                  double plus = 0, minus = 0;
                  for (double v : bal.values()) { if (v >= 0) plus += v; else minus += v; }
                  LinearLayout top = card();
                  LinearLayout r0 = new LinearLayout(this);
                  r0.setPadding(0, dp(12), 0, dp(12));
                  r0.addView(sumCell("สินทรัพย์", plus, Ui.BLUE));
                  r0.addView(sumCell("หนี้สิน", -minus, Ui.RED));
                  r0.addView(sumCell("รวม", plus + minus, Ui.DARK));
                  top.addView(r0);

                  LinearLayout lc = card();
                  int i = 0;
                  for (Map.Entry<String, Double> e : bal.entrySet()) {
                      LinearLayout r = new LinearLayout(this);
                      r.setGravity(Gravity.CENTER_VERTICAL);
                      r.setPadding(dp(16), dp(14), dp(16), dp(14));
                      r.addView(Ui.one(text(15, Ui.DARK, e.getKey())), new LinearLayout.LayoutParams(0, WRAP, 1f));
