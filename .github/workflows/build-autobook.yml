          package com.example.autobook;

          import android.content.Context;
          import android.net.Uri;
          import com.google.android.gms.tasks.Tasks;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.Text;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          import java.io.File;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Quick number-only OCR (works in background). AI re-checks later. */
          public class Slip {
              private static TextRecognizer rec;
              private static final Pattern MONEY = Pattern.compile(
                  "(?<![0-9.,])([0-9]{1,3}(?:,[0-9]{3})+|[0-9]+)\\.([0-9]{2})(?![0-9]|\\.[0-9])");

              /** full OCR text, call from a background thread */
              public static String readText(Context ctx, File f) {
                  try {
                      InputImage img = InputImage.fromFilePath(ctx, Uri.fromFile(f));
                      synchronized (Slip.class) {
                          if (rec == null) rec = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                      }
                      return Tasks.await(rec.process(img)).getText();
                  } catch (Exception e) {
                      return null;
                  }
              }

              /** call from a background thread */
              public static String readAmount(Context ctx, File f) {
                  try {
                      InputImage img = InputImage.fromFilePath(ctx, Uri.fromFile(f));
                      synchronized (Slip.class) {
                          if (rec == null) rec = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                      }
                      Text t = Tasks.await(rec.process(img));
                      return pick(t.getText());
                  } catch (Exception e) {
                      return null;
                  }
              }

              static String pick(String s) {
                  Matcher m = MONEY.matcher(s);
                  double best = 0;
                  String bestS = null;
                  while (m.find()) {
                      String n = m.group(1).replace(",", "") + "." + m.group(2);
                      try {
                          double v = Double.parseDouble(n);
                          if (v > best) { best = v; bestS = n; }
                      } catch (NumberFormatException ignored) { }
                  }
                  return bestS;
              }
          }
