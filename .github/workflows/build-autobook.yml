              private void save() {
                  double a;
                  try {
                      a = Double.parseDouble(amount.getText().toString().replace(",", "").trim());
                  } catch (Exception e) {
                      Toast.makeText(this, "ใส่จำนวนเงินก่อน", Toast.LENGTH_SHORT).show();
