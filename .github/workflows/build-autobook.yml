          package com.example.autobook;

          import android.app.Notification;
          import android.content.ContentUris;
          import android.database.ContentObserver;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class BankNotificationService extends NotificationListenerService {
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final ExecutorService bg = Executors.newSingleThreadExecutor();
              private ContentObserver observer;
              private long lastImageId = -1L;

              @Override
              public void onListenerConnected() {
                  Util.debug(this, "SYSTEM: บริการเชื่อมต่อแล้ว");
                  startImageWatch();
              }

              @Override
              public void onListenerDisconnected() { stopImageWatch(); }

              @Override
              public void onDestroy() {
                  stopImageWatch();
                  super.onDestroy();
              }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  if (sbn == null) return;
                  String pkg = sbn.getPackageName();
                  if (pkg == null || pkg.equals(getPackageName()) || !BankParser.isBank(pkg)) return;
                  Notification n = sbn.getNotification();
                  if ((n.flags & Notification.FLAG_GROUP_SUMMARY) != 0) return;
                  Bundle ex = n.extras;
                  if (ex == null) return;
                  CharSequence t = ex.getCharSequence(Notification.EXTRA_TITLE);
                  CharSequence b = ex.getCharSequence(Notification.EXTRA_BIG_TEXT);
                  if (b == null) b = ex.getCharSequence(Notification.EXTRA_TEXT);
                  final String title = t == null ? "" : t.toString();
                  final String text = b == null ? "" : b.toString();
                  final long when = sbn.getPostTime();
                  bg.execute(() -> handleNotification(pkg, title, text, when));
              }

              private void handleNotification(String pkg, String title, String text, long when) {
                  BankParser.Result r = BankParser.parse(pkg, title, text);
                  Util.debug(this, (r != null ? "OK " + r.amount : "X อ่านยอดไม่ได้") + " | " + pkg + " | " + title + " | " + text);
                  if (r == null) return;
                  Db db = Db.get(this);
                  if (db.duplicate(r.bank, r.amount, when - 120000L)) return;

                  // slip image arrived first -> fill in the real amount
                  Db.Tx slip = db.recent(r.bank, "slip", when - 300000L, false);
                  if (slip != null) {
                      slip.amount = r.amount; slip.type = r.type; slip.note = r.note;
                      slip.source = "noti"; slip.needCat = slip.category.isEmpty();
                      db.update(slip);
                      Notifier.saved(this, slip, "📷");
                      return;
                  }

                  Db.Tx x = new Db.Tx();
                  x.ts = when; x.type = r.type; x.amount = r.amount;
                  x.account = Util.account(r.bank); x.bank = r.bank; x.note = r.note; x.source = "noti";
                  db.addAccount(x.account);
                  String c = db.shopCategory(Util.key(x.note));
                  if (c != null) x.category = c; else x.needCat = true;
                  db.insert(x);
                  Notifier.saved(this, x, null);
              }

              // ---------- slip images saved by bank apps ----------
              private void startImageWatch() {
                  if (observer != null) return;
                  observer = new ContentObserver(handler) {
                      @Override public void onChange(boolean selfChange, Uri uri) { checkNewImage(); }
                  };
                  try {
                      getContentResolver().registerContentObserver(
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI, true, observer);
                  } catch (Exception e) {
                      Util.debug(this, "IMG watch error: " + e.getMessage());
                  }
              }

              private void stopImageWatch() {
                  if (observer != null) {
                      getContentResolver().unregisterContentObserver(observer);
                      observer = null;
                  }
              }

              private void checkNewImage() {
                  String[] proj = { MediaStore.Images.Media._ID, MediaStore.Images.Media.RELATIVE_PATH, MediaStore.Images.Media.DISPLAY_NAME };
                  String sel = MediaStore.Images.Media.DATE_ADDED + " > ?";
                  String[] args = { String.valueOf(System.currentTimeMillis() / 1000L - 120L) };
                  try (Cursor c = getContentResolver().query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                          proj, sel, args, MediaStore.Images.Media.DATE_ADDED + " DESC")) {
                      if (c == null || !c.moveToFirst()) return;
                      long id = c.getLong(0);
                      if (id == lastImageId) return;
                      lastImageId = id;
                      String path = c.getString(1) == null ? "" : c.getString(1);
                      String name = c.getString(2) == null ? "" : c.getString(2);
                      final String bank = BankParser.bankFromPath(path + "/" + name);
                      Util.debug(this, "IMG " + (bank == null ? "- ไม่ใช่สลิป" : "สลิป " + bank) + " | " + path + name);
                      if (bank == null) return;
                      final Uri uri = ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id);
                      bg.execute(() -> handleSlip(bank, uri));
                  } catch (Exception e) {
                      Util.debug(this, "IMG error (ยังไม่ได้อนุญาตรูปภาพ?): " + e.getMessage());
                  }
              }

              private void handleSlip(String bank, Uri uri) {
                  try { Thread.sleep(2500L); } catch (InterruptedException ignored) { }
                  String name;
                  try {
                      name = Photos.copy(this, uri);
                  } catch (Exception e) {
                      Util.debug(this, "IMG copy error: " + e.getMessage());
                      return;
                  }
                  Db db = Db.get(this);
                  long now = System.currentTimeMillis();
                  String b = "SLIP".equals(bank) ? null : bank;

                  // notification already saved this payment -> just attach the photo
                  Db.Tx t = db.recent(b, "noti", now - 300000L, true);
                  if (t != null) {
                      t.photo = name;
                      db.update(t);
                      Util.debug(this, "แนบรูปสลิปกับรายการ " + Util.money(t.amount));
                      return;
                  }

                  String amt = Slip.readAmount(this, Photos.file(this, name));
                  Db.Tx x = new Db.Tx();
                  x.ts = now; x.type = 0;
                  try { x.amount = amt == null ? 0 : Double.parseDouble(amt); } catch (Exception e) { x.amount = 0; }
                  x.account = Util.account(bank); x.bank = bank; x.note = "สลิป " + bank;
                  x.photo = name; x.source = "slip"; x.needAi = true;
                  db.addAccount(x.account);
                  db.insert(x);
                  Notifier.saved(this, x, "📷 จากสลิป (ตรวจยอด)");
              }
          }
