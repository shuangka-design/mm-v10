              private void renderDaily(List<Db.Tx> list) {
                  if (list.isEmpty()) { note("\nเดือนนี้ยังไม่มีรายการ\nกด + เพื่อเพิ่ม"); return; }
                  SimpleDateFormat key = new SimpleDateFormat("yyyyMMdd", Locale.US);
                  SimpleDateFormat wk = new SimpleDateFormat("EEE", TH);
                  SimpleDateFormat my = new SimpleDateFormat("MM.yyyy", Locale.US);
                  SimpleDateFormat hm = new SimpleDateFormat("HH:mm", Locale.US);
                  LinkedHashMap<String, List<Db.Tx>> groups = new LinkedHashMap<>();
                  for (Db.Tx t : list) groups.computeIfAbsent(key.format(new Date(t.ts)), k -> new ArrayList<>()).add(t);
                  for (List<Db.Tx> day : groups.values()) {
                      Calendar c = Calendar.getInstance();
                      c.setTimeInMillis(day.get(0).ts);
                      double inc = 0, exp = 0;
                      for (Db.Tx t : day) { if (t.type == 1) inc += t.amount; else if (t.type == 0) exp += t.amount; }
                      LinearLayout card = card();
                      LinearLayout h = new LinearLayout(this);
                      h.setGravity(Gravity.CENTER_VERTICAL);
                      h.setPadding(dp(14), dp(10), dp(14), dp(10));
                      TextView dn = text(22, Ui.DARK, String.valueOf(c.get(Calendar.DAY_OF_MONTH)));
                      dn.setTypeface(null, Typeface.BOLD);
                      h.addView(dn);
                      int dow = c.get(Calendar.DAY_OF_WEEK);
                      TextView chip = text(11, Color.WHITE, wk.format(c.getTime()));
                      chip.setPadding(dp(6), dp(1), dp(6), dp(1));
                      chip.setBackground(Ui.round(dow == Calendar.SUNDAY ? Ui.RED : dow == Calendar.SATURDAY ? Ui.BLUE : Ui.GRAY, dp(4), 0, 0));
                      LinearLayout.LayoutParams cp = new LinearLayout.LayoutParams(WRAP, WRAP);
                      cp.setMargins(dp(8), 0, dp(6), 0);
                      h.addView(chip, cp);
                      h.addView(text(12, Ui.GRAY, my.format(c.getTime())), new LinearLayout.LayoutParams(0, WRAP, 1f));
                      h.addView(amountCol(inc, Ui.BLUE));
                      h.addView(amountCol(exp, Ui.RED));
                      card.addView(h);
                      card.addView(Ui.line(this));
                      for (Db.Tx t : day) card.addView(txRow(t, hm));
                  }
              }

              private View txRow(Db.Tx t, SimpleDateFormat hm) {
                  LinearLayout r = new LinearLayout(this);
                  r.setGravity(Gravity.CENTER_VERTICAL);
                  r.setPadding(dp(14), dp(10), dp(14), dp(10));
                  String c = t.type == 2 ? "⇄ โอน" : t.type == 3 ? "ปรับยอด"
                      : !t.category.isEmpty() ? t.category : (t.needAi || t.needCat ? "🤖 รอ AI" : "-");
                  r.addView(Ui.one(text(13, Ui.GRAY, c)), new LinearLayout.LayoutParams(dp(92), WRAP));
                  LinearLayout mid = new LinearLayout(this);
                  mid.setOrientation(LinearLayout.VERTICAL);
                  mid.addView(Ui.one(text(15, Ui.DARK, t.type == 2 ? t.account + " → " + t.toAccount : t.note.isEmpty() ? c : t.note)));
                  boolean check = t.amount == 0 || ("slip".equals(t.source) && t.needAi);
                  mid.addView(Ui.one(text(12, Ui.GRAY, (t.type == 2 ? "ไม่นับในรายรับ/รายจ่าย" : t.account) + "   " + hm.format(new Date(t.ts))
                      + (t.photo.isEmpty() ? "" : "   📷") + (check ? "   ⚠️ตรวจยอด" : ""))));
                  r.addView(mid, new LinearLayout.LayoutParams(0, WRAP, 1f));
