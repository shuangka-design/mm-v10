              public static final int DARK = Color.rgb(33, 33, 33);
              public static final int GRAY = Color.rgb(150, 150, 150);
              public static final int LINE = Color.rgb(228, 228, 228);

              public static int dp(Context c, float v) { return Math.round(v * c.getResources().getDisplayMetrics().density); }

              public static GradientDrawable round(int fill, float radius, int stroke, int strokeW) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(fill);
                  g.setCornerRadius(radius);
                  if (strokeW > 0) g.setStroke(strokeW, stroke);
                  return g;
              }

              public static TextView text(Context c, float size, int color, String s) {
                  TextView t = new TextView(c);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setText(s);
                  return t;
              }

              public static TextView one(TextView t) {
                  t.setSingleLine(true);
                  t.setEllipsize(TextUtils.TruncateAt.END);
                  return t;
              }

              public static View line(Context c) {
                  View v = new View(c);
                  v.setBackgroundColor(LINE);
                  v.setLayoutParams(new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 1));
                  return v;
              }
          }
