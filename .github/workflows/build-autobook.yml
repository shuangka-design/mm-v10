              // ---------------- AI ----------------
              private void setupAi() {
                  toast("กำลังตรวจ AI...");
                  bg.execute(() -> {
                      aiStatus = Ai.status();
                      runOnUiThread(() -> {
                          render();
                          if (Ai.downloadable(aiStatus)) {
                              Ai.download(msg -> runOnUiThread(() -> {
                                  toast(msg);
                                  if (msg.contains("✅")) onResume();
                              }));
                          } else {
                              toast("AI: " + Ai.statusText(aiStatus));
                          }
                      });
                  });
              }

              private void processPending() {
                  if (busy) return;
                  busy = true;
                  bg.execute(() -> {
                      try {
                          Db db = Db.get(this);
                          List<Db.Tx> list = db.pending();
                          if (list.isEmpty()) return;
                          boolean ai = Ai.ready();
                          for (Db.Tx t : list) {
                              List<String> cats = db.categories(t.type);
                              try {
                                  if (t.needAi) {
                                      if (!ai) continue;
                                      String[] r = t.photo.isEmpty() ? null : Ai.readSlip(Photos.file(this, t.photo), cats);
                                      if (r != null) {
                                          if ("slip".equals(t.source)) {
                                              try { t.amount = Double.parseDouble(r[0]); } catch (Exception ignored) { }
                                          }
                                          if ((t.note.isEmpty() || t.note.startsWith("สลิป")) && !r[1].isEmpty()) t.note = r[1];
                                          if (t.category.isEmpty()) t.category = r[2];
                                      }
                                      t.needAi = false;
                                      t.needCat = t.category.isEmpty() && !t.note.startsWith("สลิป");
                                  }
                                  if (t.needCat) {
                                      String c = db.shopCategory(Util.key(t.note));
                                      if (c == null && ai) c = Ai.categorize(t.note, cats);
                                      if (c != null) { t.category = c; t.needCat = false; }
                                  }
                                  db.update(t);
                              } catch (Exception e) {
                                  Util.debug(this, "AI error: " + e.getMessage());
                                  t.needAi = false;
                                  t.needCat = false;
                                  db.update(t);
                              }
                              runOnUiThread(this::render);
                          }
                      } finally {
                          busy = false;
                          runOnUiThread(this::render);
                      }
                  });
              }

              // ---------------- import / backup / restore ----------------
              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (res != RESULT_OK || data == null || data.getData() == null) return;
                  Uri u = data.getData();
                  if (req == REQ_IMPORT) importMm(u);
                  else if (req == REQ_RESTORE) restore(u);
                  else if (req == REQ_EXPORT_MM) exportMm(u);
              }

              private void exportMm(Uri u) {
                  toast("กำลังสร้างไฟล์ Money Manager...");
                  bg.execute(() -> {
                      String msg;
                      File dir = new File(getFilesDir(), "mmexport");
                      dir.mkdirs();
                      File tpl = new File(dir, "mm_template.mmbak");
                      File out = new File(dir, "mm_out.mmbak");
                      for (String x : new String[] { "", "-journal", "-wal", "-shm" }) new File(out.getPath() + x).delete();
                      try {
                          try (InputStream in = getContentResolver().openInputStream(u);
                               OutputStream os = new FileOutputStream(tpl)) {
                              if (in == null) throw new IOException("เปิดไฟล์ไม่ได้");
                              Photos.copy(in, os);
                          }
                          String r = Exporter.run(this, tpl, out);
                          String name = "AutoBook-MM-" + new SimpleDateFormat("yyyyMMdd-HHmm", Locale.US).format(new Date()) + ".mmbak";
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          v.put(MediaStore.Downloads.MIME_TYPE, "application/octet-stream");
                          v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/AutoBook");
                          Uri dst = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (dst == null) throw new IOException("สร้างไฟล์ไม่ได้");
                          try (InputStream in = new FileInputStream(out);
                               OutputStream os = getContentResolver().openOutputStream(dst)) {
                              Photos.copy(in, os);
                          }
                          msg = r + " → Download/AutoBook/" + name;
                      } catch (Exception e) {
                          msg = "ส่งออกไม่สำเร็จ: " + e.getMessage();
                      } finally {
                          tpl.delete();
                          for (String x : new String[] { "", "-journal", "-wal", "-shm" }) new File(out.getPath() + x).delete();
                      }
                      final String m = msg;
                      Util.debug(this, "EXPORT MM: " + m);
                      runOnUiThread(() -> new AlertDialog.Builder(this).setMessage(m).setPositiveButton("ตกลง", null).show());
                  });
              }

