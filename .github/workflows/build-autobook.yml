          cat > $J/Util.java << 'EOF'
          package com.example.autobook;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class Util {
              public static String money(double v) { return String.format(Locale.US, "%,.2f", v); }

              public static String cut(String s, int n) {
                  if (s == null) return "";
                  return s.length() > n ? s.substring(0, n) + "…" : s;
              }

              /** shop key for remembering categories: drop numbers/dates/amounts */
              public static String key(String note) {
                  if (note == null) return "";
                  String k = note.replaceAll("[0-9.,:/\\-]+", " ").replaceAll("\\s+", " ").trim().toLowerCase(Locale.ROOT);
                  return k.length() > 40 ? k.substring(0, 40) : k;
              }

              /** bank label -> account name in this app */
              public static String account(String bank) {
                  if ("KTB".equals(bank)) return "กรุงไทย";
                  if ("KMA".equals(bank)) return "กรุงศรี";
                  if ("GSB".equals(bank)) return "ออมสิน";
                  if ("BBL".equals(bank)) return "AAT";
                  if ("TrueMoney".equals(bank)) return "TrueMoney";
                  return "Cash";
              }

              /** account for this bank, user can change it in settings (BBL has AAT + BK692) */
              public static String account(Context c, String bank) {
                  String v = p(c).getString("acc_" + bank, "");
                  return v.isEmpty() ? account(bank) : v;
              }

              /** masked account number in slip / notification, e.g. 607-0-xxx690 -> AAT, xxx692 -> BK692 */
              private static final java.util.regex.Pattern MASK = java.util.regex.Pattern.compile(
                  "[xX*•]{2,}[\\s-]?([0-9]{3,4})(?![0-9])");

              /** user mapping "690=AAT;692=BK692" (last 3 digits -> account), works for every bank */
              public static java.util.LinkedHashMap<String, String> digitMap(Context c) {
                  java.util.LinkedHashMap<String, String> m = new java.util.LinkedHashMap<>();
                  String raw = p(c).getString("digits", "690=AAT;692=BK692");
                  for (String part : raw.split(";")) {
                      int i = part.indexOf('=');
                      if (i == 3) m.put(part.substring(0, 3), part.substring(4));
                  }
                  return m;
              }

              public static void saveDigitMap(Context c, java.util.Map<String, String> m) {
                  StringBuilder sb = new StringBuilder();
                  for (java.util.Map.Entry<String, String> e : m.entrySet()) {
                      if (sb.length() > 0) sb.append(';');
                      sb.append(e.getKey()).append('=').append(e.getValue().replace(";", " "));
                  }
                  p(c).edit().putString("digits", sb.toString()).apply();
              }

              /** last 3 digits of first masked account number in text, or null */
              public static String lastDigits(String text) {
                  if (text == null) return null;
                  java.util.regex.Matcher m = MASK.matcher(text);
                  if (!m.find()) return null;
                  String d = m.group(1);
                  return d.substring(d.length() - 3);
              }

              public static String byDigits(Context c, String text) {
                  if (text == null) return null;
                  java.util.Map<String, String> map = digitMap(c);
                  java.util.regex.Matcher m = MASK.matcher(text);
                  while (m.find()) {
                      String d = m.group(1);
                      String acc = map.get(d.substring(d.length() - 3));
                      if (acc != null) return acc;
                  }
                  return null;
              }

              /** repl == null -> forget; otherwise point bank / digit settings at repl */
              public static void replaceAccount(Context c, String old, String repl) {
                  SharedPreferences.Editor e = p(c).edit();
                  for (java.util.Map.Entry<String, ?> en : p(c).getAll().entrySet()) {
                      if (en.getKey().startsWith("acc_") && old.equals(en.getValue())) {
                          if (repl == null) e.remove(en.getKey()); else e.putString(en.getKey(), repl);
                      }
                  }
                  e.apply();
                  java.util.LinkedHashMap<String, String> m = digitMap(c);
                  java.util.Iterator<java.util.Map.Entry<String, String>> it = m.entrySet().iterator();
                  while (it.hasNext()) {
                      java.util.Map.Entry<String, String> en = it.next();
                      if (old.equals(en.getValue())) { if (repl == null) it.remove(); else en.setValue(repl); }
                  }
                  saveDigitMap(c, m);
              }

              public static void setAccount(Context c, String bank, String acc) {
                  p(c).edit().putString("acc_" + bank, acc).apply();
              }

              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("autobook", Context.MODE_PRIVATE);
              }

              public static synchronized void debug(Context c, String line) {
                  String time = new SimpleDateFormat("dd/MM HH:mm:ss", Locale.US).format(new Date());
                  String entry = "[" + time + "] " + (line == null ? "" : line.replace("\n", " "));
                  String old = p(c).getString("debug", "");
                  String[] lines = (old.isEmpty() ? entry : entry + "\n" + old).split("\n");
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < lines.length && i < 25; i++) {
                      if (i > 0) sb.append("\n");
                      sb.append(lines[i]);
                  }
                  p(c).edit().putString("debug", sb.toString()).apply();
              }

              public static String debugLog(Context c) { return p(c).getString("debug", ""); }
          }
