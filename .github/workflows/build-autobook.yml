                  if (accView != null) { accView = null; render(); return; }
                  super.onBackPressed();
              }

              /** one account: balance, this month in/out, spending by category, its transactions */
              private void renderAccountDetail(String acc, List<Db.Tx> monthList) {
                  final double bal = balanceOf(acc);
                  List<Db.Tx> list = new ArrayList<>();
                  double inc = 0, exp = 0, tin = 0, tout = 0;
                  Map<String, Double> cat = new HashMap<>();
                  Map<String, List<Db.Tx>> items = new HashMap<>();
                  for (Db.Tx t : monthList) {
                      String a = t.account.isEmpty() ? "ไม่ระบุบัญชี" : t.account;
                      String to = t.toAccount.isEmpty() ? "ไม่ระบุบัญชี" : t.toAccount;
                      boolean mine = a.equals(acc), into = t.type == 2 && to.equals(acc);
                      if (!mine && !into) continue;
                      list.add(t);
                      if (t.type == 2) { if (mine) tout += t.amount; if (into) tin += t.amount; }
                      else if (t.type == 1) inc += t.amount;
                      else if (t.type == 0) {
                          exp += t.amount;
                          String c = t.category.isEmpty() ? "ไม่มีหมวด" : t.category;
                          cat.merge(c, t.amount, Double::sum);
                          items.computeIfAbsent(c, k -> new ArrayList<>()).add(t);
                      }
                  }

                  LinearLayout head = card();
                  head.setPadding(dp(16), dp(10), dp(16), dp(12));
                  TextView back = text(14, Ui.BLUE, "‹ บัญชีทั้งหมด");
                  back.setPadding(0, dp(4), 0, dp(8));
                  back.setOnClickListener(v -> { accView = null; render(); });
                  head.addView(back);
                  TextView nm = text(20, Ui.DARK, acc);
                  nm.setTypeface(null, Typeface.BOLD);
                  head.addView(nm);
                  head.addView(text(14, bal >= 0 ? Ui.BLUE : Ui.RED, "ยอดคงเหลือ " + Util.money(bal) + " บาท"));
                  LinearLayout bb = new LinearLayout(this);
                  Button adj = btn("ปรับยอด", v -> adjustBalance(acc, bal));
                  Button more = btn("เปลี่ยนชื่อ / ลบ", v -> accountMenu(acc));
                  bb.addView(adj, new LinearLayout.LayoutParams(0, WRAP, 1f));
                  bb.addView(more, new LinearLayout.LayoutParams(0, WRAP, 1f));
                  head.addView(bb);

                  LinearLayout sum = card();
                  LinearLayout r1 = new LinearLayout(this);
                  r1.setPadding(0, dp(12), 0, dp(6));
                  r1.addView(sumCell("รายรับ", inc, Ui.BLUE));
                  r1.addView(sumCell("รายจ่าย", exp, Ui.RED));
                  sum.addView(r1);
                  LinearLayout r2 = new LinearLayout(this);
                  r2.setPadding(0, dp(6), 0, dp(12));
                  r2.addView(sumCell("โอนเข้า", tin, Ui.GRAY));
                  r2.addView(sumCell("โอนออก", tout, Ui.GRAY));
                  sum.addView(r2);

                  if (list.isEmpty()) { note("\nเดือนนี้บัญชีนี้ยังไม่มีรายการ\nกด ‹ › ด้านบนเพื่อดูเดือนอื่น"); return; }

                  if (exp > 0) {
                      List<Map.Entry<String, Double>> l = new ArrayList<>(cat.entrySet());
                      l.sort((x, y) -> Double.compare(y.getValue(), x.getValue()));
                      LinearLayout cc = card();
                      TextView h = text(15, Ui.DARK, "ใช้จ่ายกับอะไร");
                      h.setTypeface(null, Typeface.BOLD);
                      h.setPadding(dp(16), dp(12), dp(16), dp(4));
                      cc.addView(h);
                      LinearLayout bar = new LinearLayout(this);
                      bar.setBackground(Ui.round(Ui.LINE, dp(6), 0, 0));
                      bar.setClipToOutline(true);
                      for (int i = 0; i < l.size(); i++) {
                          View seg = new View(this);
                          seg.setBackgroundColor(PALETTE[i % PALETTE.length]);
                          bar.addView(seg, new LinearLayout.LayoutParams(0, MATCH, (float) (l.get(i).getValue() / exp)));
                      }
                      LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(MATCH, dp(12));
                      bp.setMargins(dp(16), dp(6), dp(16), dp(8));
                      cc.addView(bar, bp);
                      for (int i = 0; i < l.size(); i++) {
                          final String cn = l.get(i).getKey();
                          double v = l.get(i).getValue();
                          LinearLayout r = new LinearLayout(this);
                          r.setGravity(Gravity.CENTER_VERTICAL);
                          r.setPadding(dp(16), dp(10), dp(16), dp(10));
                          TextView pct = text(12, Color.WHITE, String.format(Locale.US, "%.0f%%", v * 100 / exp));
                          pct.setGravity(Gravity.CENTER);
                          pct.setBackground(Ui.round(PALETTE[i % PALETTE.length], dp(4), 0, 0));
                          r.addView(pct, new LinearLayout.LayoutParams(dp(44), WRAP));
                          TextView cname = Ui.one(text(15, Ui.DARK, cn + "  (" + items.get(cn).size() + ")"));
                          cname.setPadding(dp(10), 0, 0, 0);
                          r.addView(cname, new LinearLayout.LayoutParams(0, WRAP, 1f));
                          r.addView(text(15, Ui.RED, Util.money(v)));
                          r.setOnClickListener(x -> showCategory(cn, items.get(cn)));
                          cc.addView(r);
                          cc.addView(Ui.line(this));
                      }
                  }

                  LinearLayout tl = card();
                  TextView h2 = text(15, Ui.DARK, "รายการทั้งหมด (" + list.size() + ")");
                  h2.setTypeface(null, Typeface.BOLD);
                  h2.setPadding(dp(16), dp(12), dp(16), dp(4));
                  tl.addView(h2);
                  SimpleDateFormat dm = new SimpleDateFormat("d MMM", TH);
                  SimpleDateFormat hm = new SimpleDateFormat("HH:mm", Locale.US);
                  String lastDay = "";
                  for (Db.Tx t : list) {
                      String day = dm.format(new Date(t.ts));
                      if (!day.equals(lastDay)) {
                          TextView dh = text(12, Ui.GRAY, day);
                          dh.setPadding(dp(14), dp(8), dp(14), dp(2));
                          dh.setBackgroundColor(Ui.BG);
                          tl.addView(dh, new LinearLayout.LayoutParams(MATCH, WRAP));
                          lastDay = day;
                      }
                      tl.addView(txRow(t, hm));
                  }
              }

              private void adjustBalance(String acc, double cur) {
                  android.widget.EditText e = new android.widget.EditText(this);
                  e.setInputType(android.text.InputType.TYPE_CLASS_NUMBER | android.text.InputType.TYPE_NUMBER_FLAG_DECIMAL
                      | android.text.InputType.TYPE_NUMBER_FLAG_SIGNED);
                  e.setHint(String.format(Locale.US, "%.2f", cur));
                  new AlertDialog.Builder(this)
                      .setTitle(acc + " : ยอดจริงตอนนี้")
                      .setMessage("ยอดในแอป " + Util.money(cur) + " บาท\nใส่ยอดคงเหลือจริงจากแอปธนาคาร")
                      .setView(e)
                      .setPositiveButton("ปรับยอด", (d, w) -> {
                          double real;
                          try { real = Double.parseDouble(e.getText().toString().replace(",", "").trim()); }
                          catch (Exception ex) { return; }
                          double diff = Math.round((real - cur) * 100) / 100.0;
                          if (Math.abs(diff) < 0.005) { toast("ยอดตรงอยู่แล้ว"); return; }
                          Db.Tx t = new Db.Tx();
                          t.ts = System.currentTimeMillis(); t.type = 3; t.amount = diff;
                          t.account = acc; t.note = "ปรับยอดให้ตรงกับธนาคาร"; t.source = "adjust";
                          Db.get(this).insert(t);
                          toast("ปรับยอด " + acc + " เป็น " + Util.money(real) + " แล้ว");
