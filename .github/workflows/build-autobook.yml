              private void deleteAccount(String acc) {
                  Db db = Db.get(this);
                  int n = db.countAccount(acc);
                  if (n == 0) {
                      new AlertDialog.Builder(this)
                          .setMessage("ลบบัญชี " + acc + "?")
                          .setPositiveButton("ลบ", (d, w) -> { db.deleteAccount(acc, null); Util.replaceAccount(this, acc, null); render(); })
                          .setNegativeButton("ยกเลิก", null)
                          .show();
                      return;
                  }
                  new AlertDialog.Builder(this)
                      .setTitle("ลบบัญชี " + acc)
                      .setMessage("บัญชีนี้มี " + n + " รายการ จะทำอย่างไรกับรายการเหล่านี้?")
                      .setPositiveButton("ย้ายไปบัญชีอื่น", (d, w) -> {
                          final List<String> others = new ArrayList<>(db.accounts());
                          others.remove(acc);
                          if (others.isEmpty()) { toast("ไม่มีบัญชีอื่นให้ย้าย"); return; }
                          new AlertDialog.Builder(this)
                              .setTitle("ย้าย " + n + " รายการไปที่")
                              .setItems(others.toArray(new String[0]), (d2, w2) -> {
                                  String to = others.get(w2);
                                  db.deleteAccount(acc, to);
                                  Util.replaceAccount(this, acc, to);
                                  toast("ย้ายไป " + to + " และลบ " + acc + " แล้ว");
                                  render();
                              })
                              .show();
                      })
                      .setNeutralButton("ลบรายการทั้งหมดด้วย", (d, w) -> new AlertDialog.Builder(this)
                          .setMessage("ลบ " + acc + " และ " + n + " รายการถาวร?\n(ถ้ามีโอนเข้า/ออกบัญชีนี้ จะถูกลบด้วย)")
                          .setPositiveButton("ลบถาวร", (d2, w2) -> {
                              db.deleteAccount(acc, null);
                              Util.replaceAccount(this, acc, null);
                              toast("ลบแล้ว");
                              render();
                          })
                          .setNegativeButton("ยกเลิก", null)
                          .show())
                      .setNegativeButton("ยกเลิก", null)
                      .show();
              }

              private void importMm(Uri u) {
                  toast("กำลังนำเข้า...");
                  bg.execute(() -> {
                      String msg;
                      try {
                          File f = new File(getCacheDir(), "import.mmbak");
                          try (InputStream in = getContentResolver().openInputStream(u);
                               OutputStream out = new FileOutputStream(f)) {
                              if (in == null) throw new IOException("เปิดไฟล์ไม่ได้");
                              Photos.copy(in, out);
                          }
                          msg = Importer.run(this, f);
                          f.delete();
                      } catch (Exception e) {
                          msg = "นำเข้าไม่สำเร็จ: " + e.getMessage();
                      }
                      final String m = msg;
                      runOnUiThread(() -> { toast(m); nav = 0; sub = 0; render(); });
                  });
              }

              private void zipFile(ZipOutputStream z, File f, String name) throws IOException {
                  if (!f.exists()) return;
                  z.putNextEntry(new ZipEntry(name));
                  try (InputStream in = new FileInputStream(f)) { Photos.copy(in, z); }
                  z.closeEntry();
              }

              private void backup(boolean quiet) {
                  if (!quiet) toast("กำลังสำรองข้อมูล...");
                  bg.execute(() -> {
                      String msg;
                      try {
                          String name = "AutoBook-" + new SimpleDateFormat("yyyyMMdd-HHmm", Locale.US).format(new Date()) + ".zip";
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          v.put(MediaStore.Downloads.MIME_TYPE, "application/zip");
                          v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/AutoBook");
                          Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (u == null) throw new IOException("สร้างไฟล์ไม่ได้");
                          synchronized (Db.get(this)) {
                              try (OutputStream os = getContentResolver().openOutputStream(u);
                                   ZipOutputStream z = new ZipOutputStream(os)) {
                                  zipFile(z, getDatabasePath("book.db"), "book.db");
                                  File[] ps = Photos.dir(this).listFiles();
                                  if (ps != null) for (File p : ps) zipFile(z, p, "photos/" + p.getName());
                              }
                          }
                          prefs().edit().putLong("last_backup", System.currentTimeMillis()).apply();
                          pruneBackups();
                          msg = "สำรองแล้ว: Download/AutoBook/" + name;
                      } catch (Exception e) {
                          msg = "สำรองไม่สำเร็จ: " + e.getMessage();
                      }
                      final String m = msg;
                      if (quiet) Util.debug(this, "AUTO BACKUP: " + m);
                      runOnUiThread(() -> {
                          if (!quiet || m.startsWith("สำรองไม่")) toast(m);
                          if (nav == 3) render();
                      });
                  });
              }

              private void restore(Uri u) {
                  toast("กำลังกู้คืน...");
                  bg.execute(() -> {
                      String msg;
                      try {
                          File tmp = new File(getCacheDir(), "restore.db");
                          File tmpPhotos = new File(getCacheDir(), "restore_photos");
                          tmpPhotos.mkdirs();
                          boolean got = false;
                          try (InputStream in = getContentResolver().openInputStream(u);
                               ZipInputStream z = new ZipInputStream(in)) {
                              ZipEntry e;
                              while ((e = z.getNextEntry()) != null) {
                                  String n = e.getName();
                                  File out = null;
                                  if (n.equals("book.db")) { out = tmp; got = true; }
                                  else if (n.startsWith("photos/") && !e.isDirectory()) out = new File(tmpPhotos, new File(n).getName());
                                  if (out != null) {
                                      try (FileOutputStream fo = new FileOutputStream(out)) { Photos.copy(z, fo); }
                                  }
                              }
                          }
                          if (!got) throw new IOException("ไม่ใช่ไฟล์สำรองของ AutoBook");
                          Db.reset();
                          File dbf = getDatabasePath("book.db");
                          try (InputStream in = new FileInputStream(tmp); OutputStream out = new FileOutputStream(dbf)) {
                              Photos.copy(in, out);
                          }
                          new File(dbf.getPath() + "-journal").delete();
                          File[] ps = tmpPhotos.listFiles();
                          if (ps != null) for (File p : ps) {
                              try (InputStream in = new FileInputStream(p);
                                   OutputStream out = new FileOutputStream(Photos.file(this, p.getName()))) {
                                  Photos.copy(in, out);
                              }
                              p.delete();
                          }
                          tmp.delete();
                          msg = "กู้คืนเรียบร้อย ✅";
                      } catch (Exception e) {
                          msg = "กู้คืนไม่สำเร็จ: " + e.getMessage();
                      }
                      final String m = msg;
                      runOnUiThread(() -> { toast(m); render(); });
                  });
              }
          }
