          cat > $J/Exporter.java << 'EOF'
          package com.example.autobook;

          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.math.BigDecimal;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.UUID;

          /**
           * Writes AutoBook data into a copy of a real Money Manager .mmbak.
           * Every new row is cloned from an existing row of the same kind, so all the
           * columns Money Manager needs keep valid values; only the known fields change.
           */
          public class Exporter {
              private SQLiteDatabase d;
              private final Map<String, Long> nextId = new HashMap<>();
              private final Map<String, String> assetUid = new HashMap<>();
              private final Map<String, String> catUid = new HashMap<>();
              private ContentValues assetTpl, catTplEx, catTplIn;
              private Object catTypeEx, catTypeIn;
              private ContentValues tEx, tIn, t3, t4, t7, t8;
              private boolean pairSwap;

              public static String run(Context c, File template, File out) throws Exception {
                  try (InputStream in = new FileInputStream(template); OutputStream os = new FileOutputStream(out)) {
                      Photos.copy(in, os);
                  }
                  return new Exporter().go(c, out);
              }

              private static String uid() { return UUID.randomUUID().toString(); }

              private static String s(Object o) { return o == null ? "" : String.valueOf(o); }

              private ContentValues row(String sql, String... a) {
                  try (Cursor c = d.rawQuery(sql, a)) {
                      if (!c.moveToFirst()) return null;
                      ContentValues v = new ContentValues();
                      for (int i = 0; i < c.getColumnCount(); i++) {
                          String n = c.getColumnName(i);
                          switch (c.getType(i)) {
                              case Cursor.FIELD_TYPE_INTEGER: v.put(n, c.getLong(i)); break;
                              case Cursor.FIELD_TYPE_FLOAT: v.put(n, c.getDouble(i)); break;
                              case Cursor.FIELD_TYPE_STRING: v.put(n, c.getString(i)); break;
                              case Cursor.FIELD_TYPE_BLOB: v.put(n, c.getBlob(i)); break;
                              default: v.putNull(n);
                          }
                      }
                      return v;
                  }
              }

              /** set a column, keeping the template's storage kind (text vs number) */
              private static void set(ContentValues v, String col, Object val) {
                  if (!v.containsKey(col)) return;
                  Object old = v.get(col);
                  if (val == null) { v.putNull(col); return; }
                  if (old instanceof String) {
                      if (val instanceof Double) v.put(col, BigDecimal.valueOf((Double) val).stripTrailingZeros().toPlainString());
                      else v.put(col, String.valueOf(val));
                  } else if (val instanceof Double) v.put(col, (Double) val);
                  else if (val instanceof Long) v.put(col, (Long) val);
                  else if (val instanceof Integer) v.put(col, (long) (Integer) val);
                  else v.put(col, String.valueOf(val));
              }

              private static boolean sameNum(Object a, Object b) {
                  try { return Math.abs(Double.parseDouble(s(a)) - Double.parseDouble(s(b))) < 0.0001; }
                  catch (Exception e) { return false; }
              }

              private void insert(String table, ContentValues v) {
                  if (v.containsKey("ID")) {
                      Long n = nextId.get(table);
                      if (n == null) {
                          try (Cursor c = d.rawQuery("SELECT IFNULL(MAX(CAST(ID AS INTEGER)), 0) FROM " + table, null)) {
                              n = c.moveToFirst() ? c.getLong(0) + 1 : 1;
                          }
                      }
                      set(v, "ID", n);
                      nextId.put(table, n + 1);
                  }
                  try {
                      d.insertOrThrow(table, null, v);
                  } catch (Exception e) {
                      throw new RuntimeException("เขียน " + table + " ไม่ได้: " + e.getMessage() + "\nคอลัมน์: " + v.keySet()
                          + "\nโครงตาราง: " + schema(table));
                  }
              }

              private String schema(String table) {
                  StringBuilder sb = new StringBuilder();
                  try (Cursor c = d.rawQuery("SELECT sql FROM sqlite_master WHERE tbl_name = ? AND sql IS NOT NULL", new String[] { table })) {
                      while (c.moveToNext()) sb.append(c.getString(0)).append(" | ");
                  } catch (Exception ignored) { }
                  return sb.toString();
              }

              private ContentValues tx(int doType) {
                  return row("SELECT * FROM INOUTCOME WHERE CAST(DO_TYPE AS INTEGER) = ? LIMIT 1", String.valueOf(doType));
              }

              private String asset(String name) {
                  if (name == null || name.isEmpty()) name = "ไม่ระบุบัญชี";
                  String u = assetUid.get(name);
                  if (u != null) return u;
                  ContentValues v = new ContentValues(assetTpl);
                  u = uid();
                  set(v, "uid", u);
                  set(v, "NIC_NAME", name);
                  for (String k : new String[] { "C_IS_DEL", "IS_DEL" }) set(v, k, 0);
                  insert("ASSETS", v);
                  assetUid.put(name, u);
                  return u;
              }

              private String category(String name, boolean expense) {
                  if (name == null || name.isEmpty()) name = "อื่นๆ";
                  String key = (expense ? "1|" : "0|") + name;
                  String u = catUid.get(key);
                  if (u != null) return u;
                  ContentValues tpl = expense ? catTplEx : catTplIn;
                  if (tpl == null) return "";
                  ContentValues v = new ContentValues(tpl);
                  u = uid();
                  set(v, "uid", u);
                  set(v, "NAME", name);
                  for (String k : new String[] { "C_IS_DEL", "IS_DEL" }) set(v, k, 0);
                  set(v, "ORDERSEQ", catUid.size() + 100);
                  insert("ZCATEGORY", v);
                  catUid.put(key, u);
                  return u;
              }

              /** clone a transaction template, update every amount/date column that mirrors the template */
              private ContentValues fill(ContentValues tpl, int doType, long ts, double amount, String note) {
                  ContentValues v = new ContentValues(tpl);
                  Object money = tpl.get("ZMONEY"), date = tpl.get("ZDATE");
                  for (String k : tpl.keySet()) {
                      String K = k.toUpperCase(Locale.ROOT);
                      if ((K.contains("MONEY") || K.contains("AMOUNT")) && sameNum(tpl.get(k), money)) set(v, k, amount);
                      if (K.contains("DATE") && s(tpl.get(k)).equals(s(date))) set(v, k, ts);
                  }
                  set(v, "ZMONEY", amount);
                  set(v, "ZDATE", ts);
                  set(v, "DO_TYPE", doType);
                  set(v, "ZCONTENT", note == null ? "" : note);
                  set(v, "uid", uid());
                  set(v, "IS_DEL", 0);
                  return v;
              }

              private String go(Context c, File out) {
                  if (!out.exists() || out.length() == 0) throw new RuntimeException("คัดลอกไฟล์ต้นแบบไม่สำเร็จ");
                  d = SQLiteDatabase.openDatabase(out.getPath(), null,
                      SQLiteDatabase.OPEN_READWRITE | SQLiteDatabase.NO_LOCALIZED_COLLATORS);
                  try {
                      for (String t : new String[] { "INOUTCOME", "ASSETS", "ZCATEGORY" }) {
                          try (Cursor k = d.rawQuery("SELECT 1 FROM sqlite_master WHERE type = 'table' AND name = ?", new String[] { t })) {
                              if (!k.moveToFirst()) throw new RuntimeException("ไฟล์นี้ไม่ใช่ backup ของ Money Manager");
                          }
                      }
                      tEx = tx(1); tIn = tx(0); t3 = tx(3); t7 = tx(7); t8 = tx(8);
                      if (tEx == null) tEx = tIn;
                      if (tIn == null) tIn = tEx;
                      if (tEx == null) throw new RuntimeException("ใน Money Manager ต้องมีรายจ่ายหรือรายรับอย่างน้อย 1 รายการ");
                      if (t3 != null) {
                          t4 = row("SELECT * FROM INOUTCOME WHERE CAST(DO_TYPE AS INTEGER) = 4 AND ZDATE = ? LIMIT 1", s(t3.get("ZDATE")));
                          pairSwap = t4 != null && s(t4.get("assetUid")).equals(s(t3.get("toAssetUid")));
                      }
                      assetTpl = row("SELECT * FROM ASSETS LIMIT 1");
                      if (assetTpl == null) throw new RuntimeException("ใน Money Manager ต้องมีบัญชีอย่างน้อย 1 บัญชี");
                      try (Cursor k = d.rawQuery("SELECT uid, NIC_NAME FROM ASSETS", null)) {
                          while (k.moveToNext()) if (!assetUid.containsKey(s(k.getString(1)).trim())) assetUid.put(s(k.getString(1)).trim(), k.getString(0));
                      }
                      ContentValues ge = row("SELECT g.* FROM INOUTCOME i JOIN ZCATEGORY g ON g.uid = i.ctgUid WHERE CAST(i.DO_TYPE AS INTEGER) = 1 LIMIT 1");
                      ContentValues gi = row("SELECT g.* FROM INOUTCOME i JOIN ZCATEGORY g ON g.uid = i.ctgUid WHERE CAST(i.DO_TYPE AS INTEGER) = 0 LIMIT 1");
                      catTplEx = ge != null ? ge : gi;
                      catTplIn = gi != null ? gi : ge;
                      catTypeEx = ge == null ? null : ge.get("TYPE");
                      catTypeIn = gi == null ? null : gi.get("TYPE");
                      try (Cursor k = d.rawQuery("SELECT uid, NAME, TYPE FROM ZCATEGORY", null)) {
                          while (k.moveToNext()) {
                              String n = s(k.getString(1)).trim(), t = s(k.getString(2));
                              if (catTypeEx != null && t.equals(s(catTypeEx))) catUid.putIfAbsent("1|" + n, k.getString(0));
                              if (catTypeIn != null && t.equals(s(catTypeIn))) catUid.putIfAbsent("0|" + n, k.getString(0));
                          }
                      }

                      List<Db.Tx> all = Db.get(c).query(null, null, "ts");
                      int n = 0;
                      d.beginTransaction();
                      try {
                          d.delete("INOUTCOME", null, null);
                          for (Db.Tx t : all) {
                              if (t.amount == 0) continue;
                              String from = asset(t.account);
                              if (t.type == 0 || t.type == 1) {
                                  boolean ex = t.type == 0;
                                  ContentValues v = fill(ex ? tEx : tIn, ex ? 1 : 0, t.ts, t.amount, t.note);
                                  set(v, "assetUid", from);
                                  set(v, "ctgUid", category(t.category, ex));
                                  set(v, "toAssetUid", "");
                                  insert("INOUTCOME", v);
                              } else if (t.type == 2) {
                                  String to = asset(t.toAccount);
                                  ContentValues v = fill(t3 != null ? t3 : tEx, 3, t.ts, t.amount, t.note);
                                  set(v, "assetUid", from);
                                  set(v, "toAssetUid", to);
                                  if (t3 == null) set(v, "ctgUid", "");
                                  insert("INOUTCOME", v);
                                  if (t4 != null) {
                                      ContentValues w = fill(t4, 4, t.ts, t.amount, t.note);
                                      set(w, "assetUid", pairSwap ? to : from);
                                      set(w, "toAssetUid", pairSwap ? from : to);
                                      insert("INOUTCOME", w);
                                  }
                              } else if (t.type == 3) {
                                  boolean plus = t.amount > 0;
                                  ContentValues tpl = plus ? (t7 != null ? t7 : tIn) : (t8 != null ? t8 : tEx);
                                  ContentValues v = fill(tpl, plus ? 7 : 8, t.ts, Math.abs(t.amount), t.note);
                                  set(v, "assetUid", from);
                                  set(v, "toAssetUid", "");
                                  if (plus ? t7 == null : t8 == null) set(v, "ctgUid", "");
                                  insert("INOUTCOME", v);
                              }
                              n++;
                          }
                          d.setTransactionSuccessful();
                      } finally {
                          d.endTransaction();
                      }
                      return "ส่งออก " + n + " รายการ";
                  } finally {
                      d.close();
                  }
              }
          }
