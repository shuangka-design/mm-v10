                  PEOPLE.add("แม่"); PEOPLE.add("พ่อ"); PEOPLE.add("ซัน"); PEOPLE.add("อ้อน");
              }

              /** new category for an old name (unchanged if unknown) */
              public static String map(String old) {
                  if (old == null) return "";
                  String n = MAP.get(old.trim());
                  return n == null ? old.trim() : n;
              }

              /** family members move into the note: "แม่ · ค่ายา" */
              public static String note(String oldCat, String note) {
                  if (oldCat == null || !PEOPLE.contains(oldCat.trim())) return note;
                  return note == null || note.isEmpty() ? oldCat.trim() : oldCat.trim() + " · " + note;
              }
          }
