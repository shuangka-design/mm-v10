              private void renderCalendar(List<Db.Tx> list) {
                  int days = month.getActualMaximum(Calendar.DAY_OF_MONTH);
                  double[] in = new double[days + 2], ex = new double[days + 2];
                  Calendar c = Calendar.getInstance();
                  for (Db.Tx t : list) {
                      c.setTimeInMillis(t.ts);
                      int d = c.get(Calendar.DAY_OF_MONTH);
                      if (t.type == 1) in[d] += t.amount; else if (t.type == 0) ex[d] += t.amount;
                  }
                  LinearLayout box = card();
                  String[] wd = { "อา", "จ", "อ", "พ", "พฤ", "ศ", "ส" };
                  LinearLayout hr = new LinearLayout(this);
                  for (int i = 0; i < 7; i++) {
                      TextView w = text(12, i == 0 ? Ui.RED : i == 6 ? Ui.BLUE : Ui.GRAY, wd[i]);
                      w.setGravity(Gravity.CENTER);
                      w.setPadding(0, dp(6), 0, dp(6));
                      hr.addView(w, new LinearLayout.LayoutParams(0, WRAP, 1f));
                  }
                  box.addView(hr);
                  int first = month.get(Calendar.DAY_OF_WEEK) - 1;
                  int cells = ((first + days + 6) / 7) * 7;
                  Calendar today = Calendar.getInstance();
                  boolean thisMonth = today.get(Calendar.YEAR) == month.get(Calendar.YEAR)
                      && today.get(Calendar.MONTH) == month.get(Calendar.MONTH);
                  LinearLayout row = null;
                  for (int i = 0; i < cells; i++) {
                      if (i % 7 == 0) { row = new LinearLayout(this); box.addView(row); }
                      LinearLayout cell = new LinearLayout(this);
                      cell.setOrientation(LinearLayout.VERTICAL);
                      cell.setPadding(dp(3), dp(3), dp(3), dp(3));
                      int d = i - first + 1;
                      boolean isToday = thisMonth && d == today.get(Calendar.DAY_OF_MONTH);
                      cell.setBackground(Ui.round(isToday ? Color.rgb(255, 236, 236) : Color.WHITE, 0, Ui.LINE, 1));
                      if (d >= 1 && d <= days) {
                          int col = i % 7;
                          cell.addView(text(12, col == 0 ? Ui.RED : col == 6 ? Ui.BLUE : Ui.DARK, String.valueOf(d)));
                          if (in[d] > 0) cell.addView(Ui.one(text(10, Ui.BLUE, shortMoney(in[d]))));
                          if (ex[d] > 0) cell.addView(Ui.one(text(10, Ui.RED, shortMoney(ex[d]))));
                          final int day = d;
                          cell.setOnClickListener(v -> {
                              Calendar s = (Calendar) month.clone();
                              Calendar now = Calendar.getInstance();
                              s.set(Calendar.DAY_OF_MONTH, day);
                              s.set(Calendar.HOUR_OF_DAY, now.get(Calendar.HOUR_OF_DAY));
                              s.set(Calendar.MINUTE, now.get(Calendar.MINUTE));
                              openEdit(0, s.getTimeInMillis());
                          });
                      }
                      row.addView(cell, new LinearLayout.LayoutParams(0, dp(62), 1f));
                  }
                  note("แตะวันที่เพื่อเพิ่มรายการในวันนั้น");
              }

              private void renderMonthly() {
                  SimpleDateFormat mf = new SimpleDateFormat("MMMM", TH);
                  boolean any = false;
                  for (int m = 11; m >= 0; m--) {
                      Calendar s = (Calendar) month.clone();
                      s.set(Calendar.MONTH, m);
                      List<Db.Tx> l = range(s, Calendar.MONTH);
                      if (l.isEmpty()) continue;
                      any = true;
                      double inc = 0, exp = 0;
                      for (Db.Tx t : l) { if (t.type == 1) inc += t.amount; else if (t.type == 0) exp += t.amount; }
                      LinearLayout card = card();
                      LinearLayout r = new LinearLayout(this);
                      r.setGravity(Gravity.CENTER_VERTICAL);
                      r.setPadding(dp(16), dp(14), dp(16), dp(14));
                      TextView mn = text(16, Ui.DARK, mf.format(s.getTime()));
                      mn.setTypeface(null, Typeface.BOLD);
                      r.addView(mn, new LinearLayout.LayoutParams(0, WRAP, 1f));
                      LinearLayout col = new LinearLayout(this);
                      col.setOrientation(LinearLayout.VERTICAL);
                      col.setGravity(Gravity.END);
                      col.addView(text(13, Ui.BLUE, Util.money(inc)));
                      col.addView(text(13, Ui.RED, Util.money(exp)));
                      col.addView(text(12, Ui.GRAY, "รวม " + Util.money(inc - exp)));
                      r.addView(col);
                      final int mm = m;
                      r.setOnClickListener(v -> { month.set(Calendar.MONTH, mm); sub = 0; render(); });
                      card.addView(r);
                  }
                  if (!any) note("\nปีนี้ยังไม่มีรายการ");
              }

              private void renderStats(List<Db.Tx> list) {
                  int type = statType == 0 ? 0 : 1;
                  Map<String, Double> m = new HashMap<>();
                  Map<String, List<Db.Tx>> items = new HashMap<>();
                  double total = 0;
                  for (Db.Tx t : list) {
                      if (t.type != type) continue;
                      String c = t.category.isEmpty() ? "ไม่มีหมวด" : t.category;
                      m.merge(c, t.amount, Double::sum);
                      items.computeIfAbsent(c, k -> new ArrayList<>()).add(t);
                      total += t.amount;
                  }
                  if (m.isEmpty() || total <= 0) { note("\nเดือนนี้ยังไม่มี" + (type == 0 ? "รายจ่าย" : "รายรับ")); return; }
                  List<Map.Entry<String, Double>> l = new ArrayList<>(m.entrySet());
                  l.sort((a, b) -> Double.compare(b.getValue(), a.getValue()));

                  LinearLayout top = card();
                  top.setPadding(dp(16), dp(16), dp(16), dp(16));
                  top.addView(text(13, Ui.GRAY, type == 0 ? "รายจ่ายรวม" : "รายรับรวม"));
                  TextView tv = text(26, type == 0 ? Ui.RED : Ui.BLUE, Util.money(total));
                  tv.setTypeface(null, Typeface.BOLD);
                  top.addView(tv);
                  LinearLayout bar = new LinearLayout(this);
                  bar.setBackground(Ui.round(Ui.LINE, dp(8), 0, 0));
                  bar.setClipToOutline(true);
                  for (int i = 0; i < l.size(); i++) {
                      View seg = new View(this);
                      seg.setBackgroundColor(PALETTE[i % PALETTE.length]);
                      bar.addView(seg, new LinearLayout.LayoutParams(0, MATCH, (float) (l.get(i).getValue() / total)));
                  }
                  LinearLayout.LayoutParams bl = new LinearLayout.LayoutParams(MATCH, dp(16));
                  bl.setMargins(0, dp(12), 0, 0);
                  top.addView(bar, bl);

                  LinearLayout lc = card();
                  for (int i = 0; i < l.size(); i++) {
                      Map.Entry<String, Double> en = l.get(i);
                      LinearLayout r = new LinearLayout(this);
                      r.setGravity(Gravity.CENTER_VERTICAL);
                      r.setPadding(dp(14), dp(12), dp(14), dp(12));
                      int pct = (int) Math.round(en.getValue() * 100 / total);
                      TextView b = text(12, Color.WHITE, pct + "%");
                      b.setGravity(Gravity.CENTER);
                      b.setBackground(Ui.round(PALETTE[i % PALETTE.length], dp(4), 0, 0));
                      r.addView(b, new LinearLayout.LayoutParams(dp(48), dp(24)));
                      TextView n = Ui.one(text(15, Ui.DARK, en.getKey()));
                      n.setPadding(dp(12), 0, dp(8), 0);
                      r.addView(n, new LinearLayout.LayoutParams(0, WRAP, 1f));
                      r.addView(text(15, Ui.DARK, Util.money(en.getValue())));
                      final String name = en.getKey();
                      final List<Db.Tx> its = items.get(name);
                      r.setOnClickListener(v -> showCategory(name, its));
                      lc.addView(r);
                      if (i < l.size() - 1) lc.addView(Ui.line(this));
                  }
              }

              private void showCategory(String name, List<Db.Tx> its) {
                  SimpleDateFormat f = new SimpleDateFormat("dd/MM HH:mm", Locale.US);
                  String[] rows = new String[its.size()];
                  for (int i = 0; i < its.size(); i++) {
                      Db.Tx t = its.get(i);
                      rows[i] = f.format(new Date(t.ts)) + "   " + Util.money(t.amount) + "   " + Util.cut(t.note.isEmpty() ? t.account : t.note, 22);
