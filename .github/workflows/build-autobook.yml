                      final double cur = e.getValue();
                      r.setOnClickListener(v -> { accView = an; render(); });
                      r.setOnLongClickListener(v -> { accountMenu(an); return true; });
                      lc.addView(r);
                      if (++i < bal.size()) lc.addView(Ui.line(this));
                  }
                  note("แตะบัญชีเพื่อดูว่าใช้จ่ายอะไรไปบ้าง\nกดค้างเพื่อเปลี่ยนชื่อหรือลบ");
              }

              private double balanceOf(String acc) {
                  double b = 0;
                  for (Db.Tx t : Db.get(this).query(null, null, null)) {
                      String a = t.account.isEmpty() ? "ไม่ระบุบัญชี" : t.account;
                      String to = t.toAccount.isEmpty() ? "ไม่ระบุบัญชี" : t.toAccount;
                      if (t.type == 2) {
                          if (a.equals(acc)) b -= t.amount;
                          if (to.equals(acc)) b += t.amount;
                      } else if (a.equals(acc)) {
                          b += t.type == 1 || t.type == 3 ? t.amount : -t.amount;
                      }
                  }
                  return b;
              }

