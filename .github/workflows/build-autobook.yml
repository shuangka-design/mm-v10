          package com.example.autobook;

          import android.content.Context;
          import android.database.Cursor;
          import android.database.sqlite.SQLiteDatabase;
          import java.io.File;

          /** Imports income/expense from a Money Manager .mmbak backup (incl. transfers + balance adjustments). */
          public class Importer {
              private static String s(String x) { return x == null ? "" : x.trim(); }

              public static String run(Context c, File f) {
                  SQLiteDatabase src = SQLiteDatabase.openDatabase(f.getPath(), null, SQLiteDatabase.OPEN_READONLY);
                  Db db = Db.get(c);
                  SQLiteDatabase dst = db.getWritableDatabase();
                  int n = 0;
                  String sql = "SELECT i.ZDATE, CAST(i.DO_TYPE AS INTEGER), i.ZMONEY, i.ZCONTENT, a.NIC_NAME, g.NAME, b.NIC_NAME "
                      + "FROM INOUTCOME i LEFT JOIN ASSETS a ON a.uid = i.assetUid "
                      + "LEFT JOIN ASSETS b ON b.uid = i.toAssetUid "
                      + "LEFT JOIN ZCATEGORY g ON g.uid = i.ctgUid "
                      + "WHERE IFNULL(i.IS_DEL, 0) = 0 AND CAST(i.DO_TYPE AS INTEGER) IN (0, 1, 3, 7, 8)";
                  int tr = 0;
                  try (Cursor cur = src.rawQuery(sql, null)) {
                      dst.beginTransaction();
                      try {
                          db.deleteSource("mm");
                          while (cur.moveToNext()) {
                              Db.Tx t = new Db.Tx();
                              try {
                                  t.ts = Long.parseLong(s(cur.getString(0)));
                                  t.amount = Double.parseDouble(s(cur.getString(2)));
                              } catch (Exception e) {
                                  continue;
                              }
                              int mt = cur.getInt(1);
                              t.note = s(cur.getString(3));
                              t.account = s(cur.getString(4));
                              if (t.account.isEmpty()) t.account = "ไม่ระบุบัญชี";
                              t.source = "mm";
                              if (mt == 3) {
                                  t.type = 2;
                                  t.toAccount = s(cur.getString(6));
                                  if (t.toAccount.isEmpty()) continue;
                                  if (t.note.isEmpty()) t.note = "โอน " + t.account + " → " + t.toAccount;
                                  db.addAccount(t.toAccount);
                                  tr++;
                              } else if (mt == 7 || mt == 8) {
                                  t.type = 3;
                                  if (mt == 8) t.amount = -t.amount;
                                  t.note = "ปรับยอด" + (t.note.isEmpty() ? "" : " (" + t.note + ")");
                              } else {
                                  t.type = mt == 1 ? 0 : 1;
                                  String old = s(cur.getString(5));
                                  if (t.type == 0 && Cats.TRUEMONEY_CAT.equals(old.trim())
                                          && !Cats.TRUEMONEY_ACC.equals(t.account)) {
                                      // top-up of my own wallet -> transfer, not an expense
                                      t.type = 2;
                                      t.toAccount = Cats.TRUEMONEY_ACC;
                                      if (t.note.isEmpty()) t.note = "เติม TrueMoney";
                                      db.addAccount(Cats.TRUEMONEY_ACC);
                                      tr++;
                                  } else {
                                      t.category = Cats.map(old);
                                      if (t.type == 0) t.note = Cats.note(old, t.note);
                                  }
                              }
                              db.insert(t);
                              db.addAccount(t.account);
                              if (t.type <= 1 && !t.category.isEmpty()) {
                                  db.addCategory(t.category, t.type);
                                  if (!t.note.isEmpty()) db.rememberShop(Util.key(t.note), t.category);
                              }
                              n++;
                          }
                          dst.setTransactionSuccessful();
                      } finally {
                          dst.endTransaction();
                      }
                  } finally {
                      src.close();
                  }
                  return "นำเข้า " + n + " รายการแล้ว (รวมการโอน " + tr + " รายการ)";
              }
          }
