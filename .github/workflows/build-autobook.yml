      - name: Fixed signing key (same key every build -> install as update)
        run: |
          set -e
          mkdir -p ~/.android
          if [ -f signing/autobook-debug.keystore ]; then
            echo "ใช้กุญแจเดิมจาก repo"
          else
            echo "ยังไม่มีกุญแจ -> สร้างใหม่ครั้งเดียว แล้วเก็บไว้ใน repo"
            mkdir -p signing
            keytool -genkeypair -keystore signing/autobook-debug.keystore -storetype JKS \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
            git add signing/autobook-debug.keystore
            git commit -m "Add fixed signing key [skip ci]"
            git push
          fi
          cp signing/autobook-debug.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "fingerprint" || true

      - name: Build APK
        run: |
          set -o pipefail
          cd /tmp/ab
          gradle assembleDebug --console=plain 2>&1 | tee /tmp/build.log

      - name: Show real errors (only if build failed)
        if: failure()
        run: |
          echo "=========== ERRORS ==========="
          grep -n -i -E "error:|what went wrong|cannot find symbol|cannot access|duplicate class|requires|minCompileSdk" -A 4 /tmp/build.log | head -n 80 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoBook-APK
          path: /tmp/ab/app/build/outputs/apk/debug/app-debug.apk
