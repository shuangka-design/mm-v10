              /** keep only the newest 7 auto/manual backups this app created */
              private void pruneBackups() {
                  String[] proj = { MediaStore.Downloads._ID };
                  String sel = MediaStore.Downloads.RELATIVE_PATH + " LIKE ? AND " + MediaStore.Downloads.DISPLAY_NAME + " LIKE ?";
                  String[] args = { Environment.DIRECTORY_DOWNLOADS + "/AutoBook%", "AutoBook-%.zip" };
                  try (android.database.Cursor c = getContentResolver().query(MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                          proj, sel, args, MediaStore.Downloads.DATE_ADDED + " DESC")) {
                      if (c == null) return;
                      int n = 0;
                      while (c.moveToNext()) {
                          if (++n <= 7) continue;
                          try {
                              getContentResolver().delete(android.content.ContentUris.withAppendedId(
                                  MediaStore.Downloads.EXTERNAL_CONTENT_URI, c.getLong(0)), null, null);
                          } catch (Exception ignored) { }
