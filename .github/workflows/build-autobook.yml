          import java.util.zip.ZipInputStream;
          import java.util.zip.ZipOutputStream;

          public class MainActivity extends Activity {
              private static final int REQ_IMPORT = 11, REQ_RESTORE = 12;
              private static final Locale TH = new Locale("th", "TH");
              private static final int WRAP = LinearLayout.LayoutParams.WRAP_CONTENT;
              private static final int MATCH = LinearLayout.LayoutParams.MATCH_PARENT;
              private final ExecutorService bg = Executors.newSingleThreadExecutor();
              private final Calendar month = Calendar.getInstance();
              private int page = 0;
              private volatile boolean busy = false;
              private volatile int aiStatus = -2;
              private LinearLayout content;
              private TextView monthLabel, totals;

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  month.set(Calendar.DAY_OF_MONTH, 1);
                  month.set(Calendar.HOUR_OF_DAY, 0);
                  month.set(Calendar.MINUTE, 0);
                  month.set(Calendar.SECOND, 0);
                  month.set(Calendar.MILLISECOND, 0);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 12, 24, 0);

                  LinearLayout top = new LinearLayout(this);
                  top.setGravity(Gravity.CENTER_VERTICAL);
                  top.addView(btn("◀", v -> { month.add(Calendar.MONTH, -1); render(); }));
                  monthLabel = new TextView(this);
                  monthLabel.setTextSize(19f);
                  monthLabel.setGravity(Gravity.CENTER);
                  top.addView(monthLabel, new LinearLayout.LayoutParams(0, WRAP, 1f));
                  top.addView(btn("▶", v -> { month.add(Calendar.MONTH, 1); render(); }));
                  root.addView(top);

                  totals = new TextView(this);
                  totals.setTextSize(14f);
                  totals.setGravity(Gravity.CENTER);
                  root.addView(totals);

                  LinearLayout tabs = new LinearLayout(this);
                  String[] names = { "รายการ", "สรุป", "ตั้งค่า" };
                  for (int i = 0; i < names.length; i++) {
                      final int p = i;
                      tabs.addView(btn(names[i], v -> { page = p; render(); }), new LinearLayout.LayoutParams(0, WRAP, 1f));
                  }
                  root.addView(tabs);

                  ScrollView sv = new ScrollView(this);
                  content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(0, 0, 0, 48);
                  sv.addView(content);
                  root.addView(sv, new LinearLayout.LayoutParams(MATCH, 0, 1f));
                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  render();
                  bg.execute(() -> {
                      aiStatus = Ai.status();
                      runOnUiThread(this::render);
                  });
                  processPending();
              }

              private Button btn(String text, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setAllCaps(false);
                  b.setOnClickListener(l);
                  return b;
              }

              private TextView tv(float size, String text) {
                  TextView t = new TextView(this);
                  t.setTextSize(size);
                  t.setText(text);
                  return t;
              }

              private void toast(String m) { Toast.makeText(this, m, Toast.LENGTH_LONG).show(); }

              // ---------------- screens ----------------
              private void render() {
                  long from = month.getTimeInMillis();
                  Calendar e = (Calendar) month.clone();
                  e.add(Calendar.MONTH, 1);
                  List<Db.Tx> list = Db.get(this).range(from, e.getTimeInMillis());
                  double inc = 0, exp = 0;
                  for (Db.Tx t : list) { if (t.type == 1) inc += t.amount; else exp += t.amount; }
                  monthLabel.setText(new SimpleDateFormat("MMMM yyyy", TH).format(month.getTime()));
                  totals.setText("รายรับ " + Util.money(inc) + "   รายจ่าย " + Util.money(exp) + "   คงเหลือ " + Util.money(inc - exp));
                  content.removeAllViews();
                  if (page == 0) renderList(list);
                  else if (page == 1) renderSummary(list);
                  else renderSettings();
              }

              private void renderList(List<Db.Tx> list) {
                  content.addView(btn("+ เพิ่มรายการเอง", v -> startActivity(new Intent(this, EditActivity.class))));
                  if (busy) content.addView(tv(13f, "🤖 AI กำลังจัดหมวด / อ่านสลิป..."));
                  if (list.isEmpty()) {
                      content.addView(tv(15f, "\n(เดือนนี้ยังไม่มีรายการ)"));
                      return;
                  }
                  SimpleDateFormat day = new SimpleDateFormat("EEEE d MMM", TH);
                  SimpleDateFormat hm = new SimpleDateFormat("HH:mm", Locale.US);
                  String last = "";
                  for (Db.Tx t : list) {
                      String d = day.format(new Date(t.ts));
                      if (!d.equals(last)) {
                          last = d;
                          TextView h = tv(14f, "\n" + d);
                          h.setTypeface(null, Typeface.BOLD);
                          h.setTextColor(Color.DKGRAY);
                          content.addView(h);
                      }
                      LinearLayout r = new LinearLayout(this);
                      r.setPadding(0, 14, 0, 14);
                      r.setGravity(Gravity.CENTER_VERTICAL);
                      String c = !t.category.isEmpty() ? t.category : (t.needAi || t.needCat ? "🤖 รอ AI" : "❔ ไม่มีหมวด");
                      boolean check = "slip".equals(t.source) && (t.needAi || t.amount == 0);
                      TextView left = tv(15f, c + " · " + t.account + (t.photo.isEmpty() ? "" : " 📷")
                          + (check ? " ⚠️ตรวจยอด" : "")
                          + "\n" + hm.format(new Date(t.ts)) + "  " + Util.cut(t.note, 40));
                      r.addView(left, new LinearLayout.LayoutParams(0, WRAP, 1f));
                      TextView right = tv(16f, (t.type == 1 ? "+" : "-") + Util.money(t.amount));
                      right.setTextColor(t.type == 1 ? Color.rgb(25, 118, 210) : Color.rgb(211, 47, 47));
                      r.addView(right);
                      final long id = t.id;
                      r.setOnClickListener(v -> {
                          Intent i = new Intent(this, EditActivity.class);
                          i.putExtra("id", id);
                          startActivity(i);
                      });
                      content.addView(r);
                  }
              }

              private void renderSummary(List<Db.Tx> list) {
                  Map<String, Double> byCat = new HashMap<>(), byAcc = new HashMap<>(), byInc = new HashMap<>();
                  double exp = 0, inc = 0;
                  for (Db.Tx t : list) {
                      String c = t.category.isEmpty() ? "ไม่มีหมวด" : t.category;
                      if (t.type == 0) {
                          exp += t.amount;
                          byCat.merge(c, t.amount, Double::sum);
                          byAcc.merge(t.account, t.amount, Double::sum);
                      } else {
                          inc += t.amount;
                          byInc.merge(c, t.amount, Double::sum);
                      }
                  }
                  section("รายจ่ายตามหมวด", byCat, exp, Color.rgb(211, 47, 47));
                  section("รายจ่ายตามบัญชี", byAcc, exp, Color.rgb(211, 47, 47));
                  section("รายรับ", byInc, inc, Color.rgb(25, 118, 210));
              }

              private void section(String title, Map<String, Double> m, double total, int color) {
                  TextView h = tv(16f, "\n" + title + "  (" + Util.money(total) + ")");
                  h.setTypeface(null, Typeface.BOLD);
                  content.addView(h);
                  if (m.isEmpty()) { content.addView(tv(14f, "-")); return; }
                  List<Map.Entry<String, Double>> l = new ArrayList<>(m.entrySet());
                  l.sort((a, b) -> Double.compare(b.getValue(), a.getValue()));
                  double max = l.get(0).getValue();
                  for (Map.Entry<String, Double> en : l) {
                      int bars = max <= 0 ? 0 : (int) Math.round(en.getValue() / max * 18);
                      StringBuilder sb = new StringBuilder();
                      for (int i = 0; i < Math.max(bars, 1); i++) sb.append('█');
                      int pct = total <= 0 ? 0 : (int) Math.round(en.getValue() * 100 / total);
                      TextView a = tv(14f, en.getKey() + "   " + Util.money(en.getValue()) + "  (" + pct + "%)");
                      a.setPadding(0, 10, 0, 0);
                      content.addView(a);
                      TextView bar = tv(10f, sb.toString());
                      bar.setTextColor(color);
                      content.addView(bar);
                  }
              }

              private void renderSettings() {
                  content.addView(tv(15f, "\nอ่านแจ้งเตือนธนาคาร: " + (listenerEnabled() ? "✅" : "❌ (กดปุ่ม 1)")
                      + "\nเก็บรูปสลิปอัตโนมัติ: " + (imagesAllowed() ? "✅" : "❌ (กดปุ่ม 2)")
                      + "\nAI ในเครื่อง: " + (aiStatus == -2 ? "กำลังตรวจ..." : Ai.statusText(aiStatus))));

                  content.addView(btn("1. เปิดสิทธิ์อ่านการแจ้งเตือน", v ->
                      startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))));
                  content.addView(btn("2. อนุญาตแจ้งเตือน + รูปภาพ", v -> {
                      if (Build.VERSION.SDK_INT >= 33) {
                          requestPermissions(new String[] { Manifest.permission.POST_NOTIFICATIONS, Manifest.permission.READ_MEDIA_IMAGES }, 1);
                      } else {
                          requestPermissions(new String[] { Manifest.permission.READ_EXTERNAL_STORAGE }, 1);
                      }
                  }));
                  content.addView(btn("3. เชื่อมต่อบริการใหม่", v -> {
                      NotificationListenerService.requestRebind(new ComponentName(this, BankNotificationService.class));
                      toast("ส่งคำขอเชื่อมต่อใหม่แล้ว");
                  }));
                  content.addView(btn("4. ตรวจ / ดาวน์โหลด AI ในเครื่อง", v -> setupAi()));

                  content.addView(tv(16f, "\nข้อมูล"));
                  content.addView(btn("📥 นำเข้าจาก Money Manager (.mmbak)", v -> {
                      Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      i.setType("*/*");
                      startActivityForResult(i, REQ_IMPORT);
                  }));
                  content.addView(btn("💾 สำรองข้อมูล + รูป (ไปที่ Download/AutoBook)", v -> backup()));
                  content.addView(btn("♻️ กู้คืนจากไฟล์สำรอง (.zip)", v -> new AlertDialog.Builder(this)
                      .setMessage("ข้อมูลปัจจุบันจะถูกแทนที่ด้วยไฟล์สำรอง ดำเนินการต่อ?")
                      .setPositiveButton("กู้คืน", (d, w) -> {
                          Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          startActivityForResult(i, REQ_RESTORE);
                      })
                      .setNegativeButton("ยกเลิก", null)
                      .show()));
                  content.addView(btn("ทดสอบ: เพิ่มรายจ่าย 150.00 (กรุงไทย)", v -> {
                      Db.Tx t = new Db.Tx();
                      t.ts = System.currentTimeMillis(); t.amount = 150; t.account = "กรุงไทย";
                      t.note = "7-Eleven ทดสอบ"; t.source = "test"; t.needCat = true;
                      Db.get(this).insert(t);
                      Notifier.saved(this, t, null);
                      processPending();
                      render();
                  }));

                  String d = Util.debugLog(this);
                  TextView dbg = tv(11f, "\n=== debug ===\n" + (d.isEmpty() ? "(ยังไม่มี)" : d));
                  dbg.setTextColor(Color.GRAY);
                  dbg.setTextIsSelectable(true);
                  content.addView(dbg);
              }

              private boolean listenerEnabled() {
                  String flat = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                  return flat != null && flat.contains(getPackageName());
              }

              private boolean imagesAllowed() {
                  String perm = Build.VERSION.SDK_INT >= 33 ? Manifest.permission.READ_MEDIA_IMAGES : Manifest.permission.READ_EXTERNAL_STORAGE;
                  return checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED;
              }

              // ---------------- AI ----------------
              private void setupAi() {
                  toast("กำลังตรวจ AI...");
                  bg.execute(() -> {
                      aiStatus = Ai.status();
                      runOnUiThread(() -> {
                          render();
                          if (Ai.downloadable(aiStatus)) {
                              Ai.download(msg -> runOnUiThread(() -> {
                                  toast(msg);
                                  if (msg.contains("✅")) onResume();
                              }));
                          } else {
                              toast("AI: " + Ai.statusText(aiStatus));
                          }
                      });
                  });
              }

              private void processPending() {
                  if (busy) return;
                  busy = true;
                  bg.execute(() -> {
                      try {
                          Db db = Db.get(this);
                          List<Db.Tx> list = db.pending();
                          if (list.isEmpty()) return;
                          boolean ai = Ai.ready();
                          for (Db.Tx t : list) {
                              List<String> cats = db.categories(t.type);
                              try {
                                  if (t.needAi) {
                                      if (!ai) continue;
                                      String[] r = t.photo.isEmpty() ? null : Ai.readSlip(Photos.file(this, t.photo), cats);
                                      if (r != null) {
                                          if ("slip".equals(t.source)) {
                                              try { t.amount = Double.parseDouble(r[0]); } catch (Exception ignored) { }
                                          }
                                          if ((t.note.isEmpty() || t.note.startsWith("สลิป")) && !r[1].isEmpty()) t.note = r[1];
                                          if (t.category.isEmpty()) t.category = r[2];
                                      }
                                      t.needAi = false;
                                      t.needCat = t.category.isEmpty() && !t.note.startsWith("สลิป");
                                  }
                                  if (t.needCat) {
                                      String c = db.shopCategory(Util.key(t.note));
                                      if (c == null && ai) c = Ai.categorize(t.note, cats);
                                      if (c != null) { t.category = c; t.needCat = false; }
                                  }
                                  db.update(t);
                              } catch (Exception e) {
                                  Util.debug(this, "AI error: " + e.getMessage());
                                  t.needAi = false;
                                  t.needCat = false;
                                  db.update(t);
                              }
                              runOnUiThread(this::render);
                          }
                      } finally {
                          busy = false;
                          runOnUiThread(this::render);
                      }
                  });
              }

              // ---------------- import / backup / restore ----------------
              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (res != RESULT_OK || data == null || data.getData() == null) return;
                  Uri u = data.getData();
                  if (req == REQ_IMPORT) importMm(u);
                  else if (req == REQ_RESTORE) restore(u);
              }

              private void importMm(Uri u) {
                  toast("กำลังนำเข้า...");
                  bg.execute(() -> {
                      String msg;
                      try {
                          File f = new File(getCacheDir(), "import.mmbak");
                          try (InputStream in = getContentResolver().openInputStream(u);
                               OutputStream out = new FileOutputStream(f)) {
                              if (in == null) throw new IOException("เปิดไฟล์ไม่ได้");
                              Photos.copy(in, out);
                          }
                          msg = Importer.run(this, f);
                          f.delete();
                      } catch (Exception e) {
                          msg = "นำเข้าไม่สำเร็จ: " + e.getMessage();
                      }
                      final String m = msg;
                      runOnUiThread(() -> { toast(m); page = 0; render(); });
                  });
              }

              private void zipFile(ZipOutputStream z, File f, String name) throws IOException {
                  if (!f.exists()) return;
                  z.putNextEntry(new ZipEntry(name));
                  try (InputStream in = new FileInputStream(f)) { Photos.copy(in, z); }
                  z.closeEntry();
              }

              private void backup() {
                  toast("กำลังสำรองข้อมูล...");
                  bg.execute(() -> {
                      String msg;
                      try {
                          String name = "AutoBook-" + new SimpleDateFormat("yyyyMMdd-HHmm", Locale.US).format(new Date()) + ".zip";
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                          v.put(MediaStore.Downloads.MIME_TYPE, "application/zip");
                          v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/AutoBook");
                          Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          if (u == null) throw new IOException("สร้างไฟล์ไม่ได้");
                          synchronized (Db.get(this)) {
                              try (OutputStream os = getContentResolver().openOutputStream(u);
                                   ZipOutputStream z = new ZipOutputStream(os)) {
                                  zipFile(z, getDatabasePath("book.db"), "book.db");
                                  File[] ps = Photos.dir(this).listFiles();
                                  if (ps != null) for (File p : ps) zipFile(z, p, "photos/" + p.getName());
                              }
                          }
                          msg = "สำรองแล้ว: Download/AutoBook/" + name;
                      } catch (Exception e) {
                          msg = "สำรองไม่สำเร็จ: " + e.getMessage();
                      }
                      final String m = msg;
                      runOnUiThread(() -> toast(m));
                  });
              }

              private void restore(Uri u) {
                  toast("กำลังกู้คืน...");
                  bg.execute(() -> {
                      String msg;
                      try {
                          File tmp = new File(getCacheDir(), "restore.db");
                          File tmpPhotos = new File(getCacheDir(), "restore_photos");
                          tmpPhotos.mkdirs();
                          boolean got = false;
                          try (InputStream in = getContentResolver().openInputStream(u);
                               ZipInputStream z = new ZipInputStream(in)) {
                              ZipEntry e;
                              while ((e = z.getNextEntry()) != null) {
                                  String n = e.getName();
                                  File out = null;
                                  if (n.equals("book.db")) { out = tmp; got = true; }
                                  else if (n.startsWith("photos/") && !e.isDirectory()) out = new File(tmpPhotos, new File(n).getName());
                                  if (out != null) {
                                      try (FileOutputStream fo = new FileOutputStream(out)) { Photos.copy(z, fo); }
                                  }
                              }
                          }
                          if (!got) throw new IOException("ไม่ใช่ไฟล์สำรองของ AutoBook");
                          Db.reset();
                          File dbf = getDatabasePath("book.db");
                          try (InputStream in = new FileInputStream(tmp); OutputStream out = new FileOutputStream(dbf)) {
                              Photos.copy(in, out);
                          }
                          new File(dbf.getPath() + "-journal").delete();
                          File[] ps = tmpPhotos.listFiles();
                          if (ps != null) for (File p : ps) {
                              try (InputStream in = new FileInputStream(p);
                                   OutputStream out = new FileOutputStream(Photos.file(this, p.getName()))) {
                                  Photos.copy(in, out);
                              }
                              p.delete();
                          }
                          tmp.delete();
                          msg = "กู้คืนเรียบร้อย ✅";
                      } catch (Exception e) {
                          msg = "กู้คืนไม่สำเร็จ: " + e.getMessage();
                      }
                      final String m = msg;
                      runOnUiThread(() -> { toast(m); render(); });
                  });
              }
          }
          EOF

      - name: Build APK
        run: |
          set -o pipefail
          cd /tmp/ab
          gradle assembleDebug --console=plain 2>&1 | tee /tmp/build.log

      - name: Show real errors (only if build failed)
        if: failure()
        run: |
          echo "=========== ERRORS ==========="
          grep -n -i -E "error:|what went wrong|cannot find symbol|cannot access|duplicate class|requires|minCompileSdk" -A 4 /tmp/build.log | head -n 80 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoBook-APK
          path: /tmp/ab/app/build/outputs/apk/debug/app-debug.apk
