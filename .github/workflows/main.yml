name: Build MM AutoBridge APK (v13 slip OCR)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate project
        run: |
          set -e
          P=/tmp/mm
          J=$P/app/src/main/java/com/example/mmbridge
          mkdir -p $J
          cd $P

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MMAutoBridge"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.example.mmbridge"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.mmbridge"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 13
                  versionName = "13.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation("com.google.mlkit:text-recognition:16.0.0")
              implementation("com.google.android.gms:play-services-tasks:18.0.2")
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <queries>
                  <package android:name="com.realbyteapps.moneymanagerfree" />
                  <package android:name="com.realbyteapps.moneymanager" />
              </queries>
              <application
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="MM AutoBridge"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".QuickBridgeActivity"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar"
                      android:excludeFromRecents="true"
                      android:taskAffinity=""
                      android:exported="false" />
                  <service
                      android:name=".BankNotificationService"
                      android:label="MM AutoBridge"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > $J/Store.java << 'EOF'
          package com.example.mmbridge;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class Store {
              private static final String PREF = "mm_bridge";
              private static final String KEY = "rows";
              private static final String DBG = "debug";

              private static SharedPreferences p(Context ctx) {
                  return ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }

              private static String clean(String s) {
                  return s == null ? "" : s.replace("\t", " ").replace("\n", " ");
              }

              public static void add(Context ctx, String bank, String amount, String note) {
                  String date = new SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.US).format(new Date());
                  String row = date + "\t" + bank + "\tอื่นๆ\t\t" + clean(note) + "\t" + amount + "\tExpense\t";
                  String old = p(ctx).getString(KEY, "");
                  p(ctx).edit().putString(KEY, old.isEmpty() ? row : old + "\n" + row).commit();
              }

              /** Adds only if the same amount was not recorded in the last 2 minutes. */
              public static synchronized boolean addIfNew(Context ctx, String bank, String amount, String note) {
                  long now = System.currentTimeMillis();
                  String lastAmt = p(ctx).getString("lastAmt", "");
                  long lastTime = p(ctx).getLong("lastTime", 0L);
                  if (amount.equals(lastAmt) && now - lastTime < 120000L) return false;
                  p(ctx).edit().putString("lastAmt", amount).putLong("lastTime", now).commit();
                  add(ctx, bank, amount, note);
                  return true;
              }

              public static synchronized void debug(Context ctx, String line) {
                  String time = new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date());
                  String entry = "[" + time + "] " + clean(line);
                  String old = p(ctx).getString(DBG, "");
                  String all = old.isEmpty() ? entry : entry + "\n" + old;
                  String[] lines = all.split("\n");
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < lines.length && i < 30; i++) {
                      if (i > 0) sb.append("\n");
                      sb.append(lines[i]);
                  }
                  p(ctx).edit().putString(DBG, sb.toString()).commit();
              }

              public static String rows(Context ctx) { return p(ctx).getString(KEY, ""); }
              public static String debugLog(Context ctx) { return p(ctx).getString(DBG, ""); }

              public static void clear(Context ctx) {
                  p(ctx).edit().remove(KEY).remove(DBG).remove("lastAmt").remove("lastTime").commit();
              }

              public static String tsv(Context ctx) {
                  String header = "Date\tAccount\tCategory\tSubcategory\tNote\tAmount\tIncome/Expense\tDescription";
                  String r = rows(ctx);
                  return r.isEmpty() ? header : header + "\n" + r;
              }
          }
          EOF

          cat > $J/BankParser.java << 'EOF'
          package com.example.mmbridge;

          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class BankParser {
              public static final Map<String, String> BANKS = new HashMap<>();
              static {
                  BANKS.put("ktbcs.netbank", "KTB");
                  BANKS.put("com.bbl.mobilebanking", "BBL");
                  BANKS.put("com.bangkokbank.mobilebanking", "BBL");
                  BANKS.put("com.krungsri.kma", "KMA");
                  BANKS.put("com.gsb.mymo", "GSB");
                  BANKS.put("th.co.truemoney.wallet", "TrueMoney");
              }

              /** keyword in image folder/file name -> bank label */
              private static final String[][] FOLDERS = {
                  { "krungthai", "KTB" }, { "ktb", "KTB" },
                  { "bualuang", "BBL" }, { "bangkok bank", "BBL" }, { "bbl", "BBL" },
                  { "krungsri", "KMA" }, { "kma", "KMA" },
                  { "mymo", "GSB" }, { "gsb", "GSB" },
                  { "truemoney", "TrueMoney" },
                  { "slip", "SLIP" }
              };

              private static final String[] IGNORE = { "เงินเข้า", "OTP" };

              private static final String NUM = "([0-9][0-9,]*(?:\\.[0-9]{1,2})?)";
              private static final Pattern AFTER = Pattern.compile(
                  "-?" + NUM + "\\s*(?:บาท|บ\\.|THB|฿)", Pattern.CASE_INSENSITIVE);
              private static final Pattern BEFORE = Pattern.compile(
                  "(?:THB|฿|จำนวนเงิน|จำนวน|ยอดเงิน|ยอด)\\s*:?\\s*-?" + NUM, Pattern.CASE_INSENSITIVE);

              public static boolean isBank(String pkg) { return BANKS.containsKey(pkg); }

              public static String bankFromPath(String path) {
                  String l = path.toLowerCase(Locale.ROOT);
                  for (String[] f : FOLDERS) {
                      if (l.contains(f[0])) return f[1];
                  }
                  return null;
              }

              /** returns {bank, amount, note} or null */
              public static String[] parse(String pkg, String title, String text) {
                  String bank = BANKS.get(pkg);
                  if (bank == null) return null;
                  String msg = title + " " + text;
                  String up = msg.toUpperCase(Locale.ROOT);
                  for (String w : IGNORE) {
                      if (up.contains(w.toUpperCase(Locale.ROOT))) return null;
                  }
                  String amount = find(AFTER, msg);
                  if (amount == null) amount = find(BEFORE, msg);
                  if (amount == null) return null;
                  String note = text.length() > 40 ? text.substring(0, 40) : text;
                  return new String[] { bank, amount, note };
              }

              private static String find(Pattern p, String s) {
                  Matcher m = p.matcher(s);
                  while (m.find()) {
                      String a = m.group(1).replace(",", "");
                      try {
                          if (Double.parseDouble(a) > 0) return a;
                      } catch (NumberFormatException ignored) { }
                  }
                  return null;
              }
          }
          EOF

          cat > $J/Slip.java << 'EOF'
          package com.example.mmbridge;

          import android.content.Context;
          import android.net.Uri;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class Slip {
              public interface Result {
                  void done(String amount, String error);
              }

              private static TextRecognizer recognizer;

              // numbers with exactly 2 decimals, e.g. 150.00 or 1,250.50 (not dates like 30.10.2026)
              private static final Pattern MONEY = Pattern.compile(
                  "(?<![0-9.,])([0-9]{1,3}(?:,[0-9]{3})+|[0-9]+)\\.([0-9]{2})(?![0-9]|\\.[0-9])");

              public static void read(Context ctx, Uri uri, Result cb) {
                  InputImage img;
                  try {
                      img = InputImage.fromFilePath(ctx, uri);
                  } catch (Exception e) {
                      cb.done(null, "เปิดรูปไม่ได้: " + e.getMessage());
                      return;
                  }
                  if (recognizer == null) {
                      recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                  }
                  recognizer.process(img)
                      .addOnSuccessListener(text -> {
                          String a = pick(text.getText());
                          cb.done(a, a == null ? "หายอดเงินในรูปไม่เจอ" : null);
                      })
                      .addOnFailureListener(e -> cb.done(null, "อ่านรูปผิดพลาด: " + e.getMessage()));
              }

              /** picks the largest 2-decimal number (fee 0.00 is ignored) */
              static String pick(String s) {
                  Matcher m = MONEY.matcher(s);
                  double best = 0;
                  String bestS = null;
                  while (m.find()) {
                      String n = m.group(1).replace(",", "") + "." + m.group(2);
                      try {
                          double v = Double.parseDouble(n);
                          if (v > best) { best = v; bestS = n; }
                      } catch (NumberFormatException ignored) { }
                  }
                  return bestS;
              }
          }
          EOF

          cat > $J/BankNotificationService.java << 'EOF'
          package com.example.mmbridge;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ContentUris;
          import android.content.Context;
          import android.content.Intent;
          import android.database.ContentObserver;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          public class BankNotificationService extends NotificationListenerService {
              private static final String CH = "mm_bridge";
              private final Handler handler = new Handler(Looper.getMainLooper());
              private ContentObserver observer;
              private long lastImageId = -1L;

              static void notifyDetected(Context ctx, String bank, String amount) {
                  long now = System.currentTimeMillis();
                  NotificationManager nm = ctx.getSystemService(NotificationManager.class);
                  if (nm == null) return;
                  nm.createNotificationChannel(
                      new NotificationChannel(CH, "MM AutoBridge", NotificationManager.IMPORTANCE_HIGH));

                  Intent i = new Intent(ctx, QuickBridgeActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                  i.putExtra("amount", amount);
                  PendingIntent pi = PendingIntent.getActivity(ctx, (int) (now % 100000), i,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);

                  Notification n = new Notification.Builder(ctx, CH)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(bank + " จ่าย " + amount + " บาท")
                      .setContentText("แตะเพื่อคัดลอกยอดและเปิด Money Manager")
                      .setAutoCancel(true)
                      .setContentIntent(pi)
                      .build();
                  nm.notify((int) (now % 100000), n);
              }

              @Override
              public void onListenerConnected() {
                  Store.debug(this, "SYSTEM: บริการอ่านแจ้งเตือนเชื่อมต่อแล้ว");
                  startImageWatch();
              }

              @Override
              public void onListenerDisconnected() {
                  stopImageWatch();
              }

              @Override
              public void onDestroy() {
                  stopImageWatch();
                  super.onDestroy();
              }

              // ---------- bank notifications ----------
              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  if (sbn == null) return;
                  String pkg = sbn.getPackageName();
                  if (pkg == null || pkg.equals(getPackageName())) return;

                  // Non-bank apps: log package name only (no content, for privacy)
                  if (!BankParser.isBank(pkg)) {
                      Store.debug(this, "- " + pkg);
                      return;
                  }

                  Bundle ex = sbn.getNotification().extras;
                  if (ex == null) return;
                  CharSequence t = ex.getCharSequence(Notification.EXTRA_TITLE);
                  CharSequence b = ex.getCharSequence(Notification.EXTRA_BIG_TEXT);
                  if (b == null) b = ex.getCharSequence(Notification.EXTRA_TEXT);
                  String title = t == null ? "" : t.toString();
                  String text = b == null ? "" : b.toString();

                  String[] r = BankParser.parse(pkg, title, text);
                  Store.debug(this, (r != null ? "OK จับได้ " + r[1] : "X ธนาคาร แต่อ่านยอดไม่ได้")
                      + " | " + pkg + " | " + title + " | " + text);
                  if (r == null) return;

                  if (Store.addIfNew(this, r[0], r[1], r[2])) {
                      notifyDetected(this, r[0], r[1]);
                  }
              }

              // ---------- slip images ----------
              private void startImageWatch() {
                  if (observer != null) return;
                  observer = new ContentObserver(handler) {
                      @Override
                      public void onChange(boolean selfChange, Uri uri) {
                          checkNewImage();
                      }
                  };
                  getContentResolver().registerContentObserver(
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI, true, observer);
              }

              private void stopImageWatch() {
                  if (observer != null) {
                      getContentResolver().unregisterContentObserver(observer);
                      observer = null;
                  }
              }

              private void checkNewImage() {
                  String[] proj = {
                      MediaStore.Images.Media._ID,
                      MediaStore.Images.Media.RELATIVE_PATH,
                      MediaStore.Images.Media.DISPLAY_NAME
                  };
                  long since = System.currentTimeMillis() / 1000L - 120L;
                  String sel = MediaStore.Images.Media.DATE_ADDED + " > ?";
                  String[] args = { String.valueOf(since) };
                  String order = MediaStore.Images.Media.DATE_ADDED + " DESC";

                  try (Cursor c = getContentResolver().query(
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI, proj, sel, args, order)) {
                      if (c == null || !c.moveToFirst()) return;
                      long id = c.getLong(0);
                      if (id == lastImageId) return;
                      lastImageId = id;

                      String path = c.getString(1) == null ? "" : c.getString(1);
                      String name = c.getString(2) == null ? "" : c.getString(2);
                      final String bank = BankParser.bankFromPath(path + "/" + name);
                      Store.debug(this, "IMG " + (bank == null ? "- ไม่ใช่สลิป" : "สลิป " + bank) + " | " + path + name);
                      if (bank == null) return;

                      final Uri uri = ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id);
                      // wait a moment so the bank app finishes writing the file
                      handler.postDelayed(() -> Slip.read(this, uri, (amount, err) -> {
                          if (amount == null) {
                              Store.debug(this, "X สลิป " + bank + " อ่านยอดไม่ได้: " + err);
                              return;
                          }
                          Store.debug(this, "OK สลิป " + bank + " ยอด " + amount);
                          if (Store.addIfNew(this, bank, amount, "สลิป " + bank)) {
                              notifyDetected(this, bank, amount);
                          }
                      }), 1500L);
                  } catch (Exception e) {
                      Store.debug(this, "IMG error (ยังไม่ได้อนุญาตรูปภาพ?): " + e.getMessage());
                  }
              }
          }
          EOF

          cat > $J/QuickBridgeActivity.java << 'EOF'
          package com.example.mmbridge;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Toast;

          public class QuickBridgeActivity extends Activity {
              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  String amount = getIntent().getStringExtra("amount");
                  if (amount != null && !amount.isEmpty()) {
                      ClipboardManager cb = getSystemService(ClipboardManager.class);
                      if (cb != null) cb.setPrimaryClip(ClipData.newPlainText("amount", amount));
                      Toast.makeText(this, "คัดลอก " + amount + " บาทแล้ว", Toast.LENGTH_SHORT).show();
                  }
                  Intent mm = getPackageManager().getLaunchIntentForPackage("com.realbyteapps.moneymanagerfree");
                  if (mm == null) mm = getPackageManager().getLaunchIntentForPackage("com.realbyteapps.moneymanager");
                  if (mm != null) {
                      mm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(mm);
                  } else {
                      Toast.makeText(this, "ไม่พบแอป Money Manager", Toast.LENGTH_SHORT).show();
                  }
                  finish();
              }
          }
          EOF

          cat > $J/MainActivity.java << 'EOF'
          package com.example.mmbridge;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ComponentName;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.service.notification.NotificationListenerService;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private static final int PICK_SLIP = 7;
              private TextView status;
              private TextView log;

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 40, 40, 40);

                  status = new TextView(this);
                  status.setTextSize(16f);
                  status.setPadding(0, 0, 0, 20);
                  root.addView(status);

                  addButton(root, "1. เปิดสิทธิ์อ่านการแจ้งเตือน", () ->
                      startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)));

                  addButton(root, "2. อนุญาตแจ้งเตือน + อ่านรูปสลิป", () -> {
                      if (Build.VERSION.SDK_INT >= 33) {
                          requestPermissions(new String[] {
                              Manifest.permission.POST_NOTIFICATIONS,
                              Manifest.permission.READ_MEDIA_IMAGES }, 1);
                      } else {
                          requestPermissions(new String[] { Manifest.permission.READ_EXTERNAL_STORAGE }, 1);
                      }
                  });

                  addButton(root, "3. เชื่อมต่อบริการใหม่ (ถ้าสถานะไม่ขึ้น)", () -> {
                      NotificationListenerService.requestRebind(
                          new ComponentName(this, BankNotificationService.class));
                      toast("ส่งคำขอเชื่อมต่อใหม่แล้ว");
                  });

                  addButton(root, "อ่านยอดจากรูปสลิป (เลือกรูป)", () -> {
                      Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                      i.setType("image/*");
                      startActivityForResult(i, PICK_SLIP);
                  });

                  addButton(root, "ทดสอบ: เพิ่มรายการ 150.00", () -> {
                      Store.add(this, "TEST", "150.00", "ทดสอบ");
                      refresh();
                      toast("เพิ่มรายการทดสอบแล้ว");
                  });

                  addButton(root, "ทดสอบ: คัดลอก 150.00 และเปิด Money Manager", () -> {
                      Intent i = new Intent(this, QuickBridgeActivity.class);
                      i.putExtra("amount", "150.00");
                      startActivity(i);
                  });

                  addButton(root, "ส่งออกไฟล์ไปที่ Download", this::export);
                  addButton(root, "รีเฟรช", this::refresh);
                  addButton(root, "ล้างทั้งหมด", () -> { Store.clear(this); refresh(); });

                  log = new TextView(this);
                  log.setTextSize(13f);
                  log.setTextIsSelectable(true);
                  log.setPadding(0, 30, 0, 0);
                  root.addView(log);

                  ScrollView sv = new ScrollView(this);
                  sv.addView(root);
                  setContentView(sv);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != PICK_SLIP || res != RESULT_OK || data == null || data.getData() == null) return;
                  toast("กำลังอ่านสลิป...");
                  Slip.read(this, data.getData(), (amount, err) -> {
                      if (amount == null) {
                          toast(err);
                          return;
                      }
                      Store.add(this, "SLIP", amount, "จากรูปสลิป");
                      ClipboardManager cb = getSystemService(ClipboardManager.class);
                      if (cb != null) cb.setPrimaryClip(ClipData.newPlainText("amount", amount));
                      toast("อ่านได้ " + amount + " บาท (คัดลอกแล้ว)");
                      refresh();
                  });
              }

              private boolean listenerEnabled() {
                  String flat = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                  return flat != null && flat.contains(getPackageName());
              }

              private boolean imagesAllowed() {
                  String perm = Build.VERSION.SDK_INT >= 33
                      ? Manifest.permission.READ_MEDIA_IMAGES
                      : Manifest.permission.READ_EXTERNAL_STORAGE;
                  return checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED;
              }

              private void refresh() {
                  status.setText(
                      (listenerEnabled() ? "อ่านแจ้งเตือน: ✅" : "อ่านแจ้งเตือน: ❌ (กดปุ่ม 1)") + "\n"
                      + (imagesAllowed() ? "อ่านรูปสลิปอัตโนมัติ: ✅" : "อ่านรูปสลิปอัตโนมัติ: ❌ (กดปุ่ม 2)"));
                  String r = Store.rows(this);
                  String d = Store.debugLog(this);
                  log.setText("=== รายการที่บันทึก ===\n"
                      + (r.isEmpty() ? "(ยังไม่มี)" : r)
                      + "\n\n=== debug ===\n"
                      + (d.isEmpty() ? "(ยังไม่มี)" : d));
              }

              private void addButton(LinearLayout root, String text, Runnable action) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setOnClickListener(v -> action.run());
                  root.addView(b);
              }

              private void toast(String m) {
                  Toast.makeText(this, m, Toast.LENGTH_LONG).show();
              }

              private void export() {
                  try {
                      ContentValues cv = new ContentValues();
                      cv.put(MediaStore.MediaColumns.DISPLAY_NAME, "MoneyManager_Import_" + System.currentTimeMillis() + ".xls");
                      cv.put(MediaStore.MediaColumns.MIME_TYPE, "application/vnd.ms-excel");
                      cv.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                      if (uri == null) { toast("สร้างไฟล์ไม่ได้"); return; }
                      try (OutputStream os = getContentResolver().openOutputStream(uri)) {
                          os.write(Store.tsv(this).getBytes(StandardCharsets.UTF_8));
                      }
                      toast("บันทึกไฟล์ในโฟลเดอร์ Download แล้ว");
                  } catch (Exception e) {
                      toast("ผิดพลาด: " + e.getMessage());
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          set -o pipefail
          cd /tmp/mm
          gradle assembleDebug --console=plain 2>&1 | tee /tmp/build.log

      - name: Show real errors (only if build failed)
        if: failure()
        run: |
          echo "=========== ERRORS ==========="
          grep -n -i -E "error:|what went wrong|cannot find symbol|cannot access|duplicate class" -A 3 /tmp/build.log | head -n 60 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MM-AutoBridge-APK
          path: /tmp/mm/app/build/outputs/apk/debug/app-debug.apk
