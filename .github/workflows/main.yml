          package com.example.mmbridge;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Toast;

          public class QuickBridgeActivity extends Activity {
              /** Copies the amount, marks the item done and opens Money Manager. */
              static void openMM(Context ctx, String id) {
                  Store.Item it = Store.get(ctx, id);
                  if (it != null && !it.amount.isEmpty()) {
                      ClipboardManager cb = ctx.getSystemService(ClipboardManager.class);
                      if (cb != null) cb.setPrimaryClip(ClipData.newPlainText("amount", it.amount));
                      String extra = (it.cat.isEmpty() ? "" : " | " + it.cat) + (it.shop.isEmpty() ? "" : " | " + it.shop);
                      Toast.makeText(ctx, "คัดลอก " + it.amount + " บาทแล้ว" + extra + "\nกด + แล้ววางในช่องจำนวนเงิน",
                          Toast.LENGTH_LONG).show();
                      Store.markDone(ctx, id);
                  } else {
                      Toast.makeText(ctx, "ยังไม่มียอด เปิดแอป MM AutoBridge ให้ AI อ่านสลิปก่อน", Toast.LENGTH_LONG).show();
                      return;
                  }
                  Intent mm = ctx.getPackageManager().getLaunchIntentForPackage("com.realbyteapps.moneymanagerfree");
                  if (mm == null) mm = ctx.getPackageManager().getLaunchIntentForPackage("com.realbyteapps.moneymanager");
                  if (mm != null) {
                      mm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      ctx.startActivity(mm);
                  } else {
                      Toast.makeText(ctx, "ไม่พบแอป Money Manager", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  String id = getIntent().getStringExtra("id");
                  Store.Item it = id == null ? null : Store.get(this, id);
                  if (it != null && it.amount.isEmpty()) {
                      // slip without amount yet -> open main app so AI can read it
                      Intent main = new Intent(this, MainActivity.class);
                      main.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(main);
                  } else if (id != null) {
                      openMM(this, id);
                  }
                  finish();
              }
          }
          EOF

          cat > $J/MainActivity.java << 'EOF'
          package com.example.mmbridge;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.service.notification.NotificationListenerService;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.List;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              private static final int PICK_SLIP = 7;
              private final ExecutorService bg = Executors.newSingleThreadExecutor();
              private volatile boolean busy = false;
              private volatile int aiStatus = -2;
              private TextView status, debug;
              private LinearLayout listBox;

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(36, 36, 36, 36);

                  status = new TextView(this);
                  status.setTextSize(15f);
                  root.addView(status);

                  addButton(root, "📷 อ่านสลิปด้วย AI (เลือกรูป)", () -> {
                      Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                      i.setType("image/*");
                      startActivityForResult(i, PICK_SLIP);
                  });

                  TextView head = new TextView(this);
                  head.setText("\nรายการรอบันทึกใน Money Manager");
                  head.setTextSize(17f);
                  root.addView(head);

                  listBox = new LinearLayout(this);
                  listBox.setOrientation(LinearLayout.VERTICAL);
                  root.addView(listBox);

                  TextView setup = new TextView(this);
                  setup.setText("\nตั้งค่า / ทดสอบ");
                  setup.setTextSize(17f);
                  root.addView(setup);

                  addButton(root, "1. เปิดสิทธิ์อ่านการแจ้งเตือน", () ->
                      startActivity(new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)));
                  addButton(root, "2. อนุญาตแจ้งเตือน + รูปภาพ", () -> {
                      if (Build.VERSION.SDK_INT >= 33) {
                          requestPermissions(new String[] { Manifest.permission.POST_NOTIFICATIONS, Manifest.permission.READ_MEDIA_IMAGES }, 1);
                      } else {
                          requestPermissions(new String[] { Manifest.permission.READ_EXTERNAL_STORAGE }, 1);
                      }
                  });
                  addButton(root, "3. เชื่อมต่อบริการใหม่", () -> {
                      NotificationListenerService.requestRebind(new ComponentName(this, BankNotificationService.class));
                      toast("ส่งคำขอเชื่อมต่อใหม่แล้ว");
                  });
                  addButton(root, "4. ตรวจ / ดาวน์โหลด AI ในเครื่อง", this::setupAi);
                  addButton(root, "ทดสอบ: เพิ่มรายการ 150.00", () -> {
                      Store.add(this, "TEST", "150.00", "7-Eleven ทดสอบ", "", "", false);
                      refresh();
                      processPending();
                  });
                  addButton(root, "ล้างทั้งหมด", () -> { Store.clearAll(this); refresh(); });

                  debug = new TextView(this);
                  debug.setTextSize(11f);
                  debug.setTextColor(Color.GRAY);
                  debug.setTextIsSelectable(true);
                  root.addView(debug);

                  ScrollView sv = new ScrollView(this);
                  sv.addView(root);
                  setContentView(sv);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
                  bg.execute(() -> {
                      aiStatus = Ai.status();
                      runOnUiThread(this::refresh);
                      processPending();
                  });
              }

              // ---------- AI work on items (app must be on screen) ----------
              private void processPending() {
                  if (busy) return;
                  busy = true;
                  bg.execute(() -> {
                      try {
                          if (!Ai.ready()) return;
                          for (Store.Item it : Store.list(this)) {
                              if (!"N".equals(it.status)) continue;
                              try {
                                  if (it.needAi && !it.uri.isEmpty()) {
                                      String[] r = Ai.readSlip(this, Uri.parse(it.uri));
                                      if (r != null) { it.amount = r[0]; it.shop = r[1]; it.cat = r[2]; }
                                      it.needAi = false;
                                      Store.update(this, it);
                                  } else if (it.cat.isEmpty()) {
                                      it.cat = Ai.categorize(it.shop);
                                      Store.update(this, it);
                                  } else {
                                      continue;
                                  }
                              } catch (Exception e) {
                                  Store.debug(this, "AI error: " + e.getMessage());
                                  it.needAi = false;
                                  if (it.cat.isEmpty()) it.cat = "อื่นๆ";
                                  Store.update(this, it);
                              }
                              runOnUiThread(this::refresh);
                          }
                      } finally {
                          busy = false;
                          runOnUiThread(this::refresh);
                      }
                  });
              }

              private void setupAi() {
                  toast("กำลังตรวจ AI...");
                  bg.execute(() -> {
                      aiStatus = Ai.status();
                      runOnUiThread(() -> {
                          refresh();
                          if (aiStatus == com.google.mlkit.genai.common.FeatureStatus.DOWNLOADABLE) {
                              Ai.download(msg -> runOnUiThread(() -> {
                                  status.setText(msg);
                                  if (msg.contains("✅")) onResume();
                              }));
                          } else {
                              toast("AI: " + Ai.statusText(aiStatus));
                          }
                      });
                  });
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req != PICK_SLIP || res != RESULT_OK || data == null || data.getData() == null) return;
                  final Uri uri = data.getData();
                  toast("AI กำลังอ่านสลิป... (5-20 วินาที)");
                  bg.execute(() -> {
                      String[] r = null;
                      String err = "";
                      if (Ai.ready()) {
                          try { r = Ai.readSlip(this, uri); } catch (Exception e) { err = e.getMessage(); }
                      } else {
                          err = "AI ยังไม่พร้อม";
                      }
                      final String[] fr = r;
                      final String ferr = err;
                      runOnUiThread(() -> {
                          if (fr != null) {
                              Store.add(this, "SLIP", fr[0], fr[1], fr[2], "", false);
                              toast("AI อ่านได้ " + fr[0] + " บาท | " + fr[2] + " | " + fr[1]);
                              refresh();
                          } else {
                              // fallback: number-only OCR
                              Store.debug(this, "AI อ่านไม่ได้ (" + ferr + ") ใช้ OCR สำรอง");
                              Slip.read(this, uri, (amount, e2) -> {
                                  if (amount == null) { toast(e2); return; }
                                  Store.add(this, "SLIP", amount, "จากรูปสลิป (OCR)", "อื่นๆ", "", false);
                                  toast("OCR สำรองอ่านได้ " + amount + " บาท (โปรดตรวจยอด)");
                                  refresh();
                              });
                          }
                      });
                  });
              }

              // ---------- UI ----------
              private boolean listenerEnabled() {
                  String flat = Settings.Secure.getString(getContentResolver(), "enabled_notification_listeners");
                  return flat != null && flat.contains(getPackageName());
              }

              private boolean imagesAllowed() {
                  String perm = Build.VERSION.SDK_INT >= 33 ? Manifest.permission.READ_MEDIA_IMAGES : Manifest.permission.READ_EXTERNAL_STORAGE;
                  return checkSelfPermission(perm) == PackageManager.PERMISSION_GRANTED;
              }

              private void refresh() {
                  status.setText("อ่านแจ้งเตือน: " + (listenerEnabled() ? "✅" : "❌ (กดปุ่ม 1)")
                      + "\nอ่านรูปสลิปอัตโนมัติ: " + (imagesAllowed() ? "✅" : "❌ (กดปุ่ม 2)")
                      + "\nAI ในเครื่อง: " + (aiStatus == -2 ? "กำลังตรวจ..." : Ai.statusText(aiStatus))
                      + (busy ? "\n🤖 AI กำลังทำงาน..." : ""));

                  listBox.removeAllViews();
                  List<Store.Item> items = Store.list(this);
                  int waiting = 0, done = 0;
                  for (int i = items.size() - 1; i >= 0; i--) {
                      final Store.Item it = items.get(i);
                      if ("D".equals(it.status)) { done++; continue; }
                      waiting++;
                      TextView tv = new TextView(this);
                      tv.setTextSize(15f);
                      tv.setPadding(0, 20, 0, 4);
                      tv.setText("[" + it.time + "] " + it.bank + "  "
                          + (it.amount.isEmpty() ? "ยังไม่มียอด" : it.amount + " บาท")
                          + "\n" + (it.cat.isEmpty() ? "🤖 รอ AI จัดหมวด" : it.cat)
                          + (it.needAi ? " (🤖 รอ AI ตรวจสลิป)" : "")
                          + (it.shop.isEmpty() ? "" : " | " + it.shop));
                      listBox.addView(tv);

                      LinearLayout row = new LinearLayout(this);
                      row.setOrientation(LinearLayout.HORIZONTAL);
                      Button save = new Button(this);
                      save.setText("คัดลอก + เปิดหมูแดง");
                      save.setEnabled(!it.amount.isEmpty());
                      save.setOnClickListener(v -> QuickBridgeActivity.openMM(this, it.id));
                      row.addView(save);
                      Button del = new Button(this);
                      del.setText("ลบ");
                      del.setOnClickListener(v -> { Store.delete(this, it.id); refresh(); });
                      row.addView(del);
                      listBox.addView(row);
                  }
                  if (waiting == 0) {
                      TextView tv = new TextView(this);
                      tv.setText("(ไม่มีรายการรอบันทึก)");
                      listBox.addView(tv);
                  }
                  TextView sum = new TextView(this);
                  sum.setText("บันทึกแล้ว " + done + " รายการ");
                  sum.setTextColor(Color.GRAY);
                  listBox.addView(sum);

                  String d = Store.debugLog(this);
                  debug.setText("\n=== debug ===\n" + (d.isEmpty() ? "(ยังไม่มี)" : d));
              }

              private void addButton(LinearLayout root, String text, Runnable action) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setOnClickListener(v -> action.run());
                  root.addView(b);
              }

              private void toast(String m) { Toast.makeText(this, m, Toast.LENGTH_LONG).show(); }
          }
          EOF

      - name: Build APK
        run: |
          set -o pipefail
          cd /tmp/mm
          gradle assembleDebug --console=plain 2>&1 | tee /tmp/build.log

      - name: Show real errors (only if build failed)
        if: failure()
        run: |
          echo "=========== ERRORS ==========="
          grep -n -i -E "error:|what went wrong|cannot find symbol|cannot access|duplicate class|requires|minCompileSdk" -A 4 /tmp/build.log | head -n 80 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MM-AutoBridge-APK
          path: /tmp/mm/app/build/outputs/apk/debug/app-debug.apk
