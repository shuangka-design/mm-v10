name: Build MM AutoBridge APK (v14 AI slip + quick save)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Generate project
        run: |
          set -e
          P=/tmp/mm
          J=$P/app/src/main/java/com/example/mmbridge
          mkdir -p $J
          cd $P

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MMAutoBridge"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.10.1" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.example.mmbridge"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.example.mmbridge"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 14
                  versionName = "14.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              // on-device Gemini Nano (Thai slip reading + categories)
              implementation("com.google.mlkit:genai-prompt:1.0.0-beta5")
              implementation("com.google.guava:guava:33.3.1-android")
              // fallback OCR (numbers only) when AI is not ready
              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.android.gms:play-services-tasks:18.2.0")
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.1.0"))
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <queries>
                  <package android:name="com.realbyteapps.moneymanagerfree" />
                  <package android:name="com.realbyteapps.moneymanager" />
              </queries>
              <application
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="MM AutoBridge"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".QuickBridgeActivity"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar"
                      android:excludeFromRecents="true"
                      android:taskAffinity=""
                      android:exported="false" />
                  <service
                      android:name=".BankNotificationService"
                      android:label="MM AutoBridge"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat > $J/Store.java << 'EOF'
          package com.example.mmbridge;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          /** Simple list of transactions stored in SharedPreferences. */
          public class Store {
              private static final String PREF = "mm_bridge";
              private static final String ITEMS = "items";
              private static final String DBG = "debug";
              private static final String SEP = "\u001F";

              public static class Item {
                  public String id = "", time = "", bank = "", amount = "", shop = "", cat = "", uri = "";
                  public String status = "N";   // N = waiting to enter in Money Manager, D = done
                  public boolean needAi = false; // slip image waiting for AI to read
              }

              private static SharedPreferences p(Context c) {
                  return c.getSharedPreferences(PREF, Context.MODE_PRIVATE);
              }

              private static String clean(String s) {
                  return s == null ? "" : s.replace(SEP, " ").replace("\t", " ").replace("\n", " ").trim();
              }

              public static synchronized List<Item> list(Context c) {
                  List<Item> out = new ArrayList<>();
                  String raw = p(c).getString(ITEMS, "");
                  if (raw.isEmpty()) return out;
                  for (String line : raw.split("\n")) {
                      String[] f = line.split(SEP, -1);
                      if (f.length < 9) continue;
                      Item it = new Item();
                      it.id = f[0]; it.time = f[1]; it.bank = f[2]; it.amount = f[3];
                      it.shop = f[4]; it.cat = f[5]; it.uri = f[6]; it.status = f[7];
                      it.needAi = "1".equals(f[8]);
                      out.add(it);
                  }
                  return out;
              }

              private static void save(Context c, List<Item> items) {
                  StringBuilder sb = new StringBuilder();
                  int start = Math.max(0, items.size() - 100); // keep last 100
                  for (int i = start; i < items.size(); i++) {
                      Item it = items.get(i);
                      if (sb.length() > 0) sb.append("\n");
                      sb.append(clean(it.id)).append(SEP).append(clean(it.time)).append(SEP)
                        .append(clean(it.bank)).append(SEP).append(clean(it.amount)).append(SEP)
                        .append(clean(it.shop)).append(SEP).append(clean(it.cat)).append(SEP)
                        .append(clean(it.uri)).append(SEP).append(clean(it.status)).append(SEP)
                        .append(it.needAi ? "1" : "0");
                  }
                  p(c).edit().putString(ITEMS, sb.toString()).commit();
              }

              /** Returns new item id, or null if same amount was added in the last 2 minutes. */
              public static synchronized String add(Context c, String bank, String amount, String shop,
                                                    String cat, String uri, boolean needAi) {
                  long now = System.currentTimeMillis();
                  List<Item> items = list(c);
                  if (amount != null && !amount.isEmpty()) {
                      String lastAmt = p(c).getString("lastAmt", "");
                      long lastTime = p(c).getLong("lastTime", 0L);
                      if (amount.equals(lastAmt) && now - lastTime < 120000L) return null;
                      p(c).edit().putString("lastAmt", amount).putLong("lastTime", now).commit();
                  }
                  Item it = new Item();
                  it.id = String.valueOf(now);
                  it.time = new SimpleDateFormat("dd/MM HH:mm", Locale.US).format(new Date(now));
                  it.bank = bank; it.amount = amount == null ? "" : amount;
                  it.shop = shop; it.cat = cat; it.uri = uri; it.needAi = needAi;
                  items.add(it);
                  save(c, items);
                  return it.id;
              }

              public static synchronized Item get(Context c, String id) {
                  for (Item it : list(c)) if (it.id.equals(id)) return it;
                  return null;
              }

              public static synchronized void update(Context c, Item item) {
                  List<Item> items = list(c);
                  for (int i = 0; i < items.size(); i++) {
                      if (items.get(i).id.equals(item.id)) { items.set(i, item); break; }
                  }
                  save(c, items);
              }

              public static synchronized void markDone(Context c, String id) {
                  Item it = get(c, id);
                  if (it != null) { it.status = "D"; update(c, it); }
              }

              public static synchronized void delete(Context c, String id) {
                  List<Item> items = list(c);
                  for (int i = 0; i < items.size(); i++) {
                      if (items.get(i).id.equals(id)) { items.remove(i); break; }
                  }
                  save(c, items);
              }

              public static synchronized void clearAll(Context c) {
                  p(c).edit().remove(ITEMS).remove(DBG).remove("lastAmt").remove("lastTime").commit();
              }

              public static synchronized void debug(Context c, String line) {
                  String time = new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date());
                  String entry = "[" + time + "] " + clean(line);
                  String old = p(c).getString(DBG, "");
                  String[] lines = (old.isEmpty() ? entry : entry + "\n" + old).split("\n");
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < lines.length && i < 20; i++) {
                      if (i > 0) sb.append("\n");
                      sb.append(lines[i]);
                  }
                  p(c).edit().putString(DBG, sb.toString()).commit();
              }

              public static String debugLog(Context c) { return p(c).getString(DBG, ""); }
          }
          EOF

          cat > $J/BankParser.java << 'EOF'
          package com.example.mmbridge;

          import java.util.HashMap;
          import java.util.Locale;
          import java.util.Map;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class BankParser {
              public static final Map<String, String> BANKS = new HashMap<>();
              static {
                  BANKS.put("ktbcs.netbank", "KTB");
                  BANKS.put("com.bbl.mobilebanking", "BBL");
                  BANKS.put("com.bangkokbank.mobilebanking", "BBL");
                  BANKS.put("com.krungsri.kma", "KMA");
                  BANKS.put("com.gsb.mymo", "GSB");
                  BANKS.put("th.co.truemoney.wallet", "TrueMoney");
              }

              private static final String[][] FOLDERS = {
                  { "krungthai", "KTB" }, { "ktb", "KTB" },
                  { "bualuang", "BBL" }, { "bangkok bank", "BBL" }, { "bbl", "BBL" },
                  { "krungsri", "KMA" }, { "kma", "KMA" },
                  { "mymo", "GSB" }, { "gsb", "GSB" },
                  { "truemoney", "TrueMoney" },
                  { "slip", "SLIP" }
              };

              private static final String[] IGNORE = { "เงินเข้า", "OTP" };

              private static final String NUM = "([0-9][0-9,]*(?:\\.[0-9]{1,2})?)";
              private static final Pattern AFTER = Pattern.compile(
                  "-?" + NUM + "\\s*(?:บาท|บ\\.|THB|฿)", Pattern.CASE_INSENSITIVE);
              private static final Pattern BEFORE = Pattern.compile(
                  "(?:THB|฿|จำนวนเงิน|จำนวน|ยอดเงิน|ยอด)\\s*:?\\s*-?" + NUM, Pattern.CASE_INSENSITIVE);

              public static boolean isBank(String pkg) { return BANKS.containsKey(pkg); }

              public static String bankFromPath(String path) {
                  String l = path.toLowerCase(Locale.ROOT);
                  for (String[] f : FOLDERS) if (l.contains(f[0])) return f[1];
                  return null;
              }

              /** returns {bank, amount, note} or null */
              public static String[] parse(String pkg, String title, String text) {
                  String bank = BANKS.get(pkg);
                  if (bank == null) return null;
                  String msg = title + " " + text;
                  String up = msg.toUpperCase(Locale.ROOT);
                  for (String w : IGNORE) if (up.contains(w.toUpperCase(Locale.ROOT))) return null;
                  String amount = find(AFTER, msg);
                  if (amount == null) amount = find(BEFORE, msg);
                  if (amount == null) return null;
                  String note = text.length() > 60 ? text.substring(0, 60) : text;
                  return new String[] { bank, amount, note };
              }

              private static String find(Pattern p, String s) {
                  Matcher m = p.matcher(s);
                  while (m.find()) {
                      String a = m.group(1).replace(",", "");
                      try { if (Double.parseDouble(a) > 0) return a; } catch (NumberFormatException ignored) { }
                  }
                  return null;
              }
          }
          EOF

          cat > $J/Ai.java << 'EOF'
          package com.example.mmbridge;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.ImageDecoder;
          import android.net.Uri;
          import com.google.mlkit.genai.common.DownloadCallback;
          import com.google.mlkit.genai.common.FeatureStatus;
          import com.google.mlkit.genai.common.GenAiException;
          import com.google.mlkit.genai.prompt.Content;
          import com.google.mlkit.genai.prompt.GenerateContentRequest;
          import com.google.mlkit.genai.prompt.GenerateContentResponse;
          import com.google.mlkit.genai.prompt.Generation;
          import com.google.mlkit.genai.prompt.ImagePart;
          import com.google.mlkit.genai.prompt.TextPart;
          import com.google.mlkit.genai.prompt.java.GenerativeModelFutures;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** On-device Gemini Nano. Must be called from a background thread, while the app is on screen. */
          public class Ai {
              public static final String[] CATS = {
                  "อาหาร", "เดินทาง", "ช้อปปิ้ง", "บิล/ค่าบริการ", "สุขภาพ", "บันเทิง", "โอนเงิน", "อื่นๆ"
              };

              private static final String SLIP_PROMPT =
                  "This image is a Thai bank transfer or payment slip. "
                  + "Reply with exactly one line in this format and nothing else:\n"
                  + "AMOUNT=<amount>;SHOP=<receiver name>;CAT=<category>\n"
                  + "AMOUNT is the paid amount (จำนวนเงิน / จำนวน) as a number like 150.00. "
                  + "It is NOT the fee (ค่าธรรมเนียม) and NOT the balance (ยอดคงเหลือ). "
                  + "SHOP is the receiver (ไปยัง / ผู้รับ / ร้าน), keep Thai text as written. "
                  + "CAT must be one of: อาหาร, เดินทาง, ช้อปปิ้ง, บิล/ค่าบริการ, สุขภาพ, บันเทิง, โอนเงิน, อื่นๆ. "
                  + "If this is not a payment slip, reply NONE.";

              private static final Pattern P_AMT = Pattern.compile("AMOUNT\\s*=\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)");
              private static final Pattern P_SHOP = Pattern.compile("SHOP\\s*=\\s*([^;\\n]*)");
              private static final Pattern P_CAT = Pattern.compile("CAT\\s*=\\s*([^;\\n]*)");

              private static GenerativeModelFutures model;

              private static synchronized GenerativeModelFutures m() {
                  if (model == null) model = GenerativeModelFutures.from(Generation.INSTANCE.getClient());
                  return model;
              }

              /** returns FeatureStatus value, or -1 on error */
              public static int status() {
                  try {
                      return m().checkStatus().get();
                  } catch (Exception e) {
                      return -1;
                  }
              }

              public static boolean ready() { return status() == FeatureStatus.AVAILABLE; }

              public static String statusText(int s) {
                  if (s == FeatureStatus.AVAILABLE) return "พร้อมใช้ ✅";
                  if (s == FeatureStatus.DOWNLOADABLE) return "ยังไม่ได้ดาวน์โหลด (กดปุ่ม AI)";
                  if (s == FeatureStatus.DOWNLOADING) return "กำลังดาวน์โหลด...";
                  if (s == FeatureStatus.UNAVAILABLE) return "เครื่องนี้ยังใช้ไม่ได้ ❌";
                  return "ตรวจสอบไม่ได้ ❌";
              }

              public interface Progress { void msg(String m); }

              public static void download(Progress cb) {
                  m().download(new DownloadCallback() {
                      @Override public void onDownloadStarted(long bytes) { cb.msg("เริ่มดาวน์โหลด AI..."); }
                      @Override public void onDownloadProgress(long done) { cb.msg("ดาวน์โหลดแล้ว " + (done / 1048576L) + " MB"); }
                      @Override public void onDownloadCompleted() { cb.msg("ดาวน์โหลด AI เสร็จแล้ว ✅"); }
                      @Override public void onDownloadFailed(GenAiException e) { cb.msg("ดาวน์โหลดไม่สำเร็จ: " + e.getMessage()); }
                  });
              }

              private static String ask(GenerateContentRequest.Builder b) throws Exception {
                  b.setTemperature(0f);
                  b.setTopK(1);
                  b.setMaxOutputTokens(120);
                  GenerateContentResponse r = m().generateContent(b.build()).get();
                  if (r.getCandidates().isEmpty()) return "";
                  String t = r.getCandidates().get(0).getText();
                  return t == null ? "" : t;
              }

              private static Bitmap load(Context c, Uri uri) throws Exception {
                  ImageDecoder.Source src = ImageDecoder.createSource(c.getContentResolver(), uri);
                  return ImageDecoder.decodeBitmap(src, (dec, info, s) -> {
                      int max = Math.max(info.getSize().getWidth(), info.getSize().getHeight());
                      int sample = 1;
                      while (max / sample > 1600) sample *= 2;
                      dec.setTargetSampleSize(sample);
                      dec.setAllocator(ImageDecoder.ALLOCATOR_SOFTWARE);
                  });
              }

              /** returns {amount, shop, cat} or null */
              public static String[] readSlip(Context c, Uri uri) throws Exception {
                  Bitmap bmp = load(c, uri);
                  GenerateContentRequest.Builder b = new GenerateContentRequest.Builder(
                      new Content.Builder()
                          .addPart(new ImagePart(bmp))
                          .addPart(new TextPart(SLIP_PROMPT))
                          .build());
                  String out = ask(b);
                  Matcher ma = P_AMT.matcher(out);
                  if (!ma.find()) return null;
                  String amount = ma.group(1).replace(",", "");
                  Matcher ms = P_SHOP.matcher(out);
                  String shop = ms.find() ? ms.group(1).trim() : "";
                  Matcher mc = P_CAT.matcher(out);
                  String cat = mc.find() ? fixCat(mc.group(1)) : "อื่นๆ";
                  return new String[] { amount, shop, cat };
              }

              public static String categorize(String text) throws Exception {
                  String prompt = "Classify this Thai payment into exactly one category from this list: "
                      + "อาหาร, เดินทาง, ช้อปปิ้ง, บิล/ค่าบริการ, สุขภาพ, บันเทิง, โอนเงิน, อื่นๆ. "
                      + "Reply with the category only.\nPayment: " + text;
                  return fixCat(ask(new GenerateContentRequest.Builder(new TextPart(prompt))));
              }

              private static String fixCat(String s) {
                  if (s == null) return "อื่นๆ";
                  for (String c : CATS) if (s.contains(c)) return c;
                  return "อื่นๆ";
              }
          }
          EOF

          cat > $J/Slip.java << 'EOF'
          package com.example.mmbridge;

          import android.content.Context;
          import android.net.Uri;
          import com.google.mlkit.vision.common.InputImage;
          import com.google.mlkit.vision.text.TextRecognition;
          import com.google.mlkit.vision.text.TextRecognizer;
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Fallback OCR: numbers only, picks the largest 2-decimal number. */
          public class Slip {
              public interface Result { void done(String amount, String error); }

              private static TextRecognizer recognizer;

              private static final Pattern MONEY = Pattern.compile(
                  "(?<![0-9.,])([0-9]{1,3}(?:,[0-9]{3})+|[0-9]+)\\.([0-9]{2})(?![0-9]|\\.[0-9])");

              public static void read(Context ctx, Uri uri, Result cb) {
                  InputImage img;
                  try {
                      img = InputImage.fromFilePath(ctx, uri);
                  } catch (Exception e) {
                      cb.done(null, "เปิดรูปไม่ได้: " + e.getMessage());
                      return;
                  }
                  if (recognizer == null) recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS);
                  recognizer.process(img)
                      .addOnSuccessListener(text -> {
                          String a = pick(text.getText());
                          cb.done(a, a == null ? "หายอดเงินในรูปไม่เจอ" : null);
                      })
                      .addOnFailureListener(e -> cb.done(null, "อ่านรูปผิดพลาด: " + e.getMessage()));
              }

              static String pick(String s) {
                  Matcher m = MONEY.matcher(s);
                  double best = 0;
                  String bestS = null;
                  while (m.find()) {
                      String n = m.group(1).replace(",", "") + "." + m.group(2);
                      try {
                          double v = Double.parseDouble(n);
                          if (v > best) { best = v; bestS = n; }
                      } catch (NumberFormatException ignored) { }
                  }
                  return bestS;
              }
          }
          EOF

          cat > $J/BankNotificationService.java << 'EOF'
          package com.example.mmbridge;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.ContentUris;
          import android.content.Context;
          import android.content.Intent;
          import android.database.ContentObserver;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.service.notification.NotificationListenerService;
          import android.service.notification.StatusBarNotification;

          public class BankNotificationService extends NotificationListenerService {
              private static final String CH = "mm_bridge";
              private final Handler handler = new Handler(Looper.getMainLooper());
              private ContentObserver observer;
              private long lastImageId = -1L;

              static void notifyItem(Context ctx, String id, String title, String text) {
                  NotificationManager nm = ctx.getSystemService(NotificationManager.class);
                  if (nm == null) return;
                  nm.createNotificationChannel(
                      new NotificationChannel(CH, "MM AutoBridge", NotificationManager.IMPORTANCE_HIGH));
                  int code = (int) (Long.parseLong(id) % 100000L);
                  Intent i = new Intent(ctx, QuickBridgeActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TASK);
                  i.putExtra("id", id);
                  PendingIntent pi = PendingIntent.getActivity(ctx, code, i,
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new Notification.Builder(ctx, CH)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(text)
                      .setAutoCancel(true)
                      .setContentIntent(pi)
                      .build();
                  nm.notify(code, n);
              }

              @Override
              public void onListenerConnected() {
                  Store.debug(this, "SYSTEM: บริการเชื่อมต่อแล้ว");
                  startImageWatch();
              }

              @Override
              public void onListenerDisconnected() { stopImageWatch(); }

              @Override
              public void onDestroy() {
                  stopImageWatch();
                  super.onDestroy();
              }

              @Override
              public void onNotificationPosted(StatusBarNotification sbn) {
                  if (sbn == null) return;
                  String pkg = sbn.getPackageName();
                  if (pkg == null || pkg.equals(getPackageName())) return;
                  if (!BankParser.isBank(pkg)) {           // privacy: package name only
                      Store.debug(this, "- " + pkg);
                      return;
                  }
                  Bundle ex = sbn.getNotification().extras;
                  if (ex == null) return;
                  CharSequence t = ex.getCharSequence(Notification.EXTRA_TITLE);
                  CharSequence b = ex.getCharSequence(Notification.EXTRA_BIG_TEXT);
                  if (b == null) b = ex.getCharSequence(Notification.EXTRA_TEXT);
                  String title = t == null ? "" : t.toString();
                  String text = b == null ? "" : b.toString();

                  String[] r = BankParser.parse(pkg, title, text);
                  Store.debug(this, (r != null ? "OK แจ้งเตือน " + r[1] : "X ธนาคาร อ่านยอดไม่ได้") + " | " + pkg + " | " + title + " | " + text);
                  if (r == null) return;

                  String id = Store.add(this, r[0], r[1], r[2], "", "", false);
                  if (id != null) {
                      notifyItem(this, id, r[0] + " จ่าย " + r[1] + " บาท", "แตะเพื่อคัดลอกยอดและเปิด Money Manager");
                  }
              }

              // ---------- slip images saved by bank apps ----------
              private void startImageWatch() {
                  if (observer != null) return;
                  observer = new ContentObserver(handler) {
                      @Override public void onChange(boolean selfChange, Uri uri) { checkNewImage(); }
                  };
                  getContentResolver().registerContentObserver(
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI, true, observer);
              }

              private void stopImageWatch() {
                  if (observer != null) {
                      getContentResolver().unregisterContentObserver(observer);
                      observer = null;
                  }
              }

              private void checkNewImage() {
                  String[] proj = { MediaStore.Images.Media._ID, MediaStore.Images.Media.RELATIVE_PATH, MediaStore.Images.Media.DISPLAY_NAME };
                  String sel = MediaStore.Images.Media.DATE_ADDED + " > ?";
                  String[] args = { String.valueOf(System.currentTimeMillis() / 1000L - 120L) };
                  try (Cursor c = getContentResolver().query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                          proj, sel, args, MediaStore.Images.Media.DATE_ADDED + " DESC")) {
                      if (c == null || !c.moveToFirst()) return;
                      long id = c.getLong(0);
                      if (id == lastImageId) return;
                      lastImageId = id;
                      String path = c.getString(1) == null ? "" : c.getString(1);
                      String name = c.getString(2) == null ? "" : c.getString(2);
                      final String bank = BankParser.bankFromPath(path + "/" + name);
                      Store.debug(this, "IMG " + (bank == null ? "- ไม่ใช่สลิป" : "สลิป " + bank) + " | " + path + name);
                      if (bank == null) return;
                      final Uri uri = ContentUris.withAppendedId(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, id);
                      // Background: quick number OCR now; AI re-reads Thai text when you open the app
                      handler.postDelayed(() -> Slip.read(this, uri, (amount, err) -> {
                          String itemId = Store.add(this, bank, amount == null ? "" : amount,
                              "สลิป " + bank, "", uri.toString(), true);
                          if (itemId == null) return;
                          notifyItem(this, itemId,
                              amount == null ? "พบสลิป " + bank : "สลิป " + bank + " " + amount + " บาท",
                              "เปิดแอปให้ AI ตรวจยอด หรือแตะเพื่อคัดลอกยอด");
                      }), 1500L);
                  } catch (Exception e) {
                      Store.debug(this, "IMG error (ยังไม่ได้อนุญาตรูปภาพ?): " + e.getMessage());
                  }
              }
          }
          EOF

